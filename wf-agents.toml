# Halo-wf's declaration for the engine of wf-agents, read from main as the engine starts: what is Halo's own, which the
# agents of its works are given and the engine runs. A path is from the root of Halo's checkout.

# The directory that holds Halo's design tree, which the engine looks at on each work's branch. The tree is in the
# engine's form: its decisions under design/decisions/, and design/principles/ once the owner writes any. design/log.md
# stays as the record of the older tree's changes and is not part of the tree.
tree = "design/"

# Halo's guide for its agents: its goal and priorities, its reference, and its research and checks.
[files.guide]
path = "AGENTS.md"

# Halo's constitution, which every agent's session holds after the guide and which decides between designs.
[files.constitution]
path = "design/constitution.md"

[project]
# Where an agent keeps what it makes for research, committed: research/investigations/ and research/experiments/.
research = "research/"
# How an agent names a test to `run_tests`, as check.yml, design-readiness.yml and fast.yml name it in their JUnit.
test_names = "a test of Halo by its target in TESTS of the Makefile: `oracle` (the embedding probe, the error, sha1 and memory checks and every oracle script, both modes), `double-text`, `design-lint`, `gate-parts`, `roots-base`, `roots-mutant-<label>`, `hosts-vm`, `hosts-lib`, `json`, `number`, `msgpack`, `design-ready` or `pin-ready`; or a part of `oracle` alone: `oracle/<group>/<script>`, one script of tests/halo-oracle/scripts/ without `.lua` (such as `oracle/apps/hash-cas`), `oracle/<group>`, every script of a group (`apps`, `coroutines`, `libs`, `lua-core`, `redis-api`), each in both modes at budgets 1, 7 and 1000, or `oracle/probe`, the embedding probe"

# Where Halo's tests are, as git pathspecs, which are all a line that changes only the tests may change: the gate's
# runners, hosts and oracle fixtures, all under tests/ (tests/README.md). The data its tests expect: the replies recorded
# on Redis 7.2.16, the collector cases' expected output and the table of double texts.
[tests]
paths = ["tests/"]
expected = [
  "tests/halo-oracle/expected/",
  "tests/halo-gc/cases/expected/",
  "tests/redis-double-text/redis-7.2.16.tsv",
]

# Halo's workflows, which the engine runs by hand on main's file with a commit given. Each reports every test as JUnit
# XML, named by its target, in the artifact `test-results`; each test runs by itself through whitefoot-kit/ci/run-tests.py.
[ci.fast]
# Runs only the tests it is given, after the compiler and its LLVM where they need it.
workflow = "fast.yml"
# The owner's own machine, the self-hosted runner 14900k: an agent waits for this workflow each time it asks for tests,
# and that machine keeps each work's build (the compiler, the test programs, the reference Lua and the compiler's cache)
# between its runs, so a run builds again only what the work changed. Every test runs there; none needs root.
runner = "14900k"
# The input that takes how long the named tests may take together, which fast.yml gives run-tests.py as its budget.
budget_input = "budget_seconds"
# The input that takes the work's number, by which fast.yml keeps the work's build.
work_input = "work"
# fast.yml's job has a limit of 20 minutes (HALO_FAST_JOB_MINUTES); a run not complete by then is cancelled, and said
# as what it found.
too_long = "25m"

[ci.full]
# Every check a merge needs, run once before the merge: the eight parts of the gate (check.yml), and the design tree's
# change log and the pin of a main release (design-readiness.yml). check.yml also checks every push but those to the
# engine's branches, and design-readiness.yml every pull request that is ready and every push to main.
workflows = ["check.yml", "design-readiness.yml"]
runner = "github"
too_long = "90m"

# Halo merges its pull requests with a merge commit, as all of them so far. A work's branch is deleted once merged, its
# commits being in main.
[pull_request]
merge_method = "merge"
delete_branch = true

# The paths that govern Halo's agents, which the owner changes: a work's change to one asks the owner whether it stays.
# The review checklist is what a work's review holds it to. The declaration is listed, since it names commands the
# engine runs.
[protected]
paths = [
  "AGENTS.md",
  "docs/review-checklist.md",
  "design/constitution.md",
  "design/principles/",
  ".github/workflows/",
  "wf-agents.toml",
]

# Halo's heavy commands, which no agent runs: builds, tests and measurements run in CI, never on the machine the agents
# run on (whitefoot-kit/README.md). `make` reaches every build and check; the others are the compilers and the runners
# that build Whitefoot programs, Redis's Lua or the benchmarks and run them, as the Makefile, the workflows and the
# research records run them.
[heavy]
commands = [
  "make",
  "whitefootc",
  "clang",
  "cc",
  "gcc",
  "ld.lld",
  "python3 -B tests/halo-e2e/run.py",
  "python3 tests/halo-e2e/run.py",
  "python3 -B tests/json/run.py",
  "python3 tests/json/run.py",
  "python3 -B tests/msgpack/run.py",
  "python3 tests/msgpack/run.py",
  "python3 -B tests/halo-number/compare.py",
  "python3 tests/halo-number/compare.py",
  "sh tests/halo-gc/controls.sh",
  "tests/halo-gc/controls.sh",
  "sh tests/halo-oracle/fetch-redis.sh",
  "tests/halo-oracle/fetch-redis.sh",
  "python3 research/experiments/halo-bench/run.py",
  "python3 -B research/experiments/halo-bench/run.py",
  "research/experiments/halo-bench/interpreters.sh",
  "whitefoot-kit/ci/run-tests.py",
  "python3 tests/build-program.py",
  "python3 -B tests/build-program.py",
  "tests/build-program.py",
  "python3 whitefoot-kit/ci/run-tests.py",
]

# The variables every agent's command line of Halo's works is given beside the engine's own: none. No command an agent
# may run reads a variable that would take it beyond its worktree; the compiler and its caches are reached only through
# the heavy commands above.
[environment]

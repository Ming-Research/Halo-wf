# Temporary, measurement-only branch (status-board item halo-bl-01-05):
# instruction-level cpu_core/cycles/ annotation of the hottest functions of
# fib and integer-table on the 14900K, every process on CPU 2, to locate the
# costs inside the call path, GetUpval and SetTableRR. Shares only, nothing
# timed. The 14900K job runs only for a commit whose message contains
# [bench]. The branch is deleted after the run.
name: annotate

on:
  push:
    branches: [claude/halo-annotate]

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build the bench program
        run: |
          set -euo pipefail
          make toolchain
          make compiler
          make toolchain-check
          wfc="$PWD/build/whitefoot/$(sed -n 's/^release = //p' whitefoot.pin)/whitefootc"
          "$wfc" --graph research/experiments/halo-bench/modules.wfg --entry bench --full-lto -o build/halo

  annotate:
    needs: build
    if: contains(github.event.head_commit.message, '[bench]')
    runs-on: [self-hosted, 14900k]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Profile and annotate
        run: |
          set -euo pipefail
          out="$PWD/build/annotate-out"
          rm -rf "$out"; mkdir -p "$out"
          make compiler
          make toolchain-check
          wfc="$PWD/build/whitefoot/$(sed -n 's/^release = //p' whitefoot.pin)/whitefootc"
          "$wfc" --graph research/experiments/halo-bench/modules.wfg --entry bench --full-lto -o "$out/halo"
          { echo "source $(git rev-parse HEAD)"; sha256sum "$wfc" "$out/halo"; perf --version; } | tee "$out/manifest.txt"
          for k in fib integer-table; do
            taskset -c 2 perf record -q -e cpu_core/cycles/ -c 100003 -o "$out/perf-$k.data" "$out/halo" < research/experiments/halo-bench/kernels/$k.lua > "$out/run-$k.out" 2>&1
            perf report -q -i "$out/perf-$k.data" --no-children --sort symbol --stdio 2>/dev/null | grep -E '^ +[0-9]' | head -n 20 > "$out/symbols-$k.txt"
            cat "$out/symbols-$k.txt" | head -n 8
            awk '{print $3}' "$out/symbols-$k.txt" | head -n 6 | while read -r sym; do
              file="$out/annotate-$k-$(echo "$sym" | sed 's/^wf_package\.halo\.vm\.//' | tr '$/' '__').txt"
              perf annotate -i "$out/perf-$k.data" --stdio --no-source -s "$sym" > "$file" 2>/dev/null || echo "annotate failed: $sym" > "$file"
              echo "== $sym: $(wc -l < "$file") lines"
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: halo-annotate
          path: |
            build/annotate-out/
            !build/annotate-out/*.data
          retention-days: 30

# Temporary, measurement-only branch for the loopmatch session
# (coord-wfbl-06-00): Halo's `run` under release wf-404f301c35c3, its generated LLVM
# IR, the IR after the optimization whitefootc applies, and the full-LTO
# binary's disassembly of the Call and Return arms and the call-path helpers.
# Hosted runner: nothing is timed. The branch is deleted after the run.
name: run-ir

on:
  push:
    branches: [claude/halo-run-ir]

defaults:
  run:
    shell: bash

jobs:
  ir:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install the host toolchain
        run: make toolchain
      - name: Emit IR, optimize it and disassemble
        run: |
          set -euo pipefail
          out="$PWD/build/run-ir"
          rm -rf "$out"; mkdir -p "$out"
          release=wf-404f301c35c3
          echo "release = $release" > whitefoot.pin
          make compiler
          wfc="$PWD/build/whitefoot/$release/whitefootc"
          "$wfc" --help > "$out/whitefootc-help.txt" 2>&1 || true
          {
            echo "source $(git rev-parse HEAD), compiler $release"
            sha256sum "$wfc"
            /usr/bin/clang --version | head -n 1
          } | tee "$out/manifest.txt"
          if "$wfc" --graph research/experiments/halo-bench/modules.wfg --entry bench --emit-llvm -o "$out/bench.ll" > "$out/emit.log" 2>&1; then
            echo "generated IR: bench.ll $(wc -c < "$out/bench.ll") bytes" | tee -a "$out/manifest.txt"
            /usr/bin/clang -O2 -falign-functions=64 -S -emit-llvm "$out/bench.ll" -o "$out/bench.opt.ll" > "$out/opt.log" 2>&1 \
              && echo "optimized IR: bench.opt.ll (clang -O2 -falign-functions=64, whitefootc's host optimization arguments; no cross-module LTO)" | tee -a "$out/manifest.txt" \
              || { echo "optimization failed"; cat "$out/opt.log"; }
          else
            echo "--emit-llvm with --graph failed:"; cat "$out/emit.log"
          fi
          "$wfc" --graph research/experiments/halo-bench/modules.wfg --entry bench --full-lto -o "$out/halo" > "$out/build.log" 2>&1
          sha256sum "$out/halo" | tee -a "$out/manifest.txt"
          nm "$out/halo" | awk '$2 ~ /[tT]/ {print $3}' | sort > "$out/symbols.txt"
          # The call path by name, independent of the instance hash and arm
          # numbering, which change between releases: every arm of `run` and its
          # dispatch, and the helpers fib's call and return reach.
          export path_re='halo\.vm\.(run\$instance\$[0-9a-f]+\.body\.|(instruction_call|instruction_tail_call|instruction_return|prepare|enter_lua|push_frame|pop_frame|finish|func_of|unwind)($|\$))'
          grep -E "$path_re" "$out/symbols.txt" > "$out/path-symbols.txt" || true
          mkdir -p "$out/disasm"
          while read -r name; do
            file="$out/disasm/$(echo "$name" | sed 's/^wf_package\.halo\.vm\.//' | tr '$/' '__').txt"
            objdump -d --no-show-raw-insn -M intel --disassemble="$name" "$out/halo" > "$file"
            calls=$(grep -oE 'call +[0-9a-f]+ <[^>]*(prepare|enter_lua|push_frame|finish|unwind|instruction_call)[^>]*>' "$file" | sed -E 's/.*<wf_package\.halo\.vm\.([^>$]*).*/\1/' | sort -u | paste -sd, - || true)
            printf '%s\t%s instructions\t%s 16-byte moves\t%s\tcalls: %s\n' "$name" \
              "$(grep -c -E '^ +[0-9a-f]+:' "$file" || true)" \
              "$(grep -c -E 'movups|movdqu|movaps|movdqa' "$file" || true)" \
              "$(grep -m1 -oE 'sub +rsp,0x[0-9a-f]+' "$file" || echo 'no frame')" \
              "${calls:-none}" >> "$out/disasm-summary.tsv"
          done < "$out/path-symbols.txt"
          echo "call-path functions disassembled: $(wc -l < "$out/path-symbols.txt")" | tee -a "$out/manifest.txt"
          echo "arms of run that call prepare (the Call arm and its kin):"
          grep -E 'calls: .*prepare' "$out/disasm-summary.tsv" | tee "$out/call-arms.tsv" || echo "none"
          # The same functions' definitions from the generated and the optimized IR.
          for ll in bench bench.opt; do
            [ -f "$out/$ll.ll" ] || continue
            awk '
              /^define / { name = $0; sub(/^[^@]*@"?/, "", name); sub(/"?\(.*/, "", name); keep = (name ~ ENVIRON["path_re"]) }
              keep { print }
              /^}/ { if (keep) print ""; keep = 0 }
            ' "$out/$ll.ll" > "$out/$ll.path.ll"
            echo "$ll.path.ll: $(grep -c '^define ' "$out/$ll.path.ll" || true) call-path definitions" | tee -a "$out/manifest.txt"
          done
          for f in "$out"/*.ll; do gzip -k "$f"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: halo-run-ir
          path: build/run-ir/
          retention-days: 30

# Temporary, for Halo-wf#3 only: the fixed-arity call entry's correctness
# gates that make check does not run. The collector's removed-root controls
# must fail on the candidate and their positive cases must pass; the call-kind
# witness must give the same reply before (main) and after. Removed before the
# pull request is marked ready.
name: fixed-call-gates

on:
  push:
    branches: [claude/fixed-call-entry]
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Install the host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld
      - name: Download the pinned compiler
        run: make compiler
      - name: Root controls and the call-kind witness
        run: |
          set -u
          wfc=$(ls -d "$PWD"/build/whitefoot/wf-*/whitefootc | head -1)
          out="$PWD/build/gates"
          mkdir -p "$out"
          status=0
          build() { (cd "$1/research/experiments/halo-e2e" && "$wfc" --graph modules.wfg --entry test -o "$2"); }
          run() { python3 -B research/experiments/halo-e2e/run.py --compiler "$wfc" --scratch-root "$out" "$@"; }
          expect() {
            want=$1; label=$2; shift 2
            "$@" > "$out/$label.log" 2>&1
            got=$?
            echo "== $label: exit $got (want $want)"
            grep -E '^(PASS|FAIL)|passed$' "$out/$label.log" | head -12
            [ "$got" = "$want" ] || status=1
          }
          G=research/experiments/halo-gc/cases
          build "$PWD" "$out/candidate" || exit 2
          expect 0 roots-at-stress run --binary "$out/candidate" --cases $G --budgets 1,7,1000 --gc-stress
          expect 0 frame-isolated run --binary "$out/candidate" --cases $G --filter gc/frame-closure --budgets 1 --gc-stress --isolate-frames
          expect 0 parked-collected run --binary "$out/candidate" --cases $G --filter gc/suspended-stack --budgets 1 --gc-stress --collect-suspended
          expect 1 parked-root-omitted run --binary "$out/candidate" --cases $G --filter gc/suspended-stack --budgets 1 --gc-stress --collect-suspended --omit-suspended-root
          C=lib/halo/vm/collect.wf
          mutant() {
            cp "$C" "$out/collect.orig"
            grep -vF "$2" "$out/collect.orig" > "$C"
            removed=$(( $(wc -l < "$out/collect.orig") - $(wc -l < "$C") ))
            echo "== mutant $1: removed $removed line(s)"
            [ "$removed" = 1 ] || status=1
            build "$PWD" "$out/mutant-$1" || { echo "mutant $1 build failed"; status=1; }
            cp "$out/collect.orig" "$C"
          }
          mutant open-upvalues 'pkg::heap::gc_mark_upvalue(heap: &vm^.heap, h: u);'
          mutant frame-closure 'pkg::heap::gc_mark(heap: &vm^.heap, v: f);'
          mutant constants 'pkg::heap::gc_mark(heap: &vm^.heap, v: k);'
          git diff --exit-code -- "$C" || status=1
          expect 1 open-upvalues-removed run --binary "$out/mutant-open-upvalues" --cases $G --filter gc/open-upvalues --budgets 1,7,1000 --gc-stress
          expect 1 frame-closure-removed run --binary "$out/mutant-frame-closure" --cases $G --filter gc/frame-closure --budgets 1 --gc-stress --isolate-frames
          expect 1 constants-removed run --binary "$out/mutant-constants" --budgets 1,7,1000 --gc-stress
          git worktree add -q "$out/main" origin/main
          (cd "$out/main" && git submodule update -q --init)
          build "$out/main" "$out/before" || { echo "before build failed"; status=1; }
          expect 0 witness-before run --binary "$out/before" --filter lua-core/call-kinds --budgets 1,7,1000
          expect 0 witness-before-stress run --binary "$out/before" --filter lua-core/call-kinds --budgets 1,7,1000 --gc-stress
          expect 0 witness-candidate run --binary "$out/candidate" --filter lua-core/call-kinds --budgets 1,7,1000
          expect 0 witness-candidate-stress run --binary "$out/candidate" --filter lua-core/call-kinds --budgets 1,7,1000 --gc-stress
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixed-call-gates
          path: build/gates/*.log
          retention-days: 14

# Halo's fast workflow (`ci.fast` of wf-agents.toml): what an agent's
# `run_tests` waits for while a work is under way. It runs only by hand, which
# only someone who may write to the repository can ask for. The engine of
# wf-agents always asks for it on main, so that this file as main holds it
# runs, with the commit to test, a value only its request knows, which the
# run's name holds, the tests to run and how long one test may run.
#
# A test is a target in TESTS of the Makefile, as check.yml and
# design-readiness.yml name it in their results. This workflow runs only the
# tests it is given, each by itself, through whitefoot-kit/ci/run-tests.py,
# after the compiler and its LLVM, which every test but the design checks,
# gate-parts and pin-ready needs. A name no test has is said in the log and
# reported as nothing, which the engine reads as a test that did not run.
# What became of each test is JUnit XML in the artifact `test-results`.
#
# A name of a family of TEST_FAMILIES in the Makefile is a test too, such as
# `oracle/apps/hash-cas`, one oracle script; run-tests.py runs it through the
# family's target and reports it under the name given.
#
# The tests run on the owner's own machine, the self-hosted runner 14900k, as
# the fast workflow of wf-agents does, because an agent waits for this
# workflow each time it asks for tests. The build is kept per work, not per
# runner, so that a work's runs build again only what the work changed since
# its last run, whichever runner takes it (.github/fast-state.sh): the
# compiler's download, the test programs, the reference Lua built from Redis
# 7.2.16's source and the compiler's cache are in
# $HOME/fast-state/Halo-wf/<work>/, which a work's first run copies from
# main/, which fast-state.yml keeps up to date. The checkout itself is cleared
# of what the last run left. A job there has no root, and needs none: it
# checks the LLVM the machine keeps (`make toolchain-check`) and installs
# nothing. Every test runs there.
#
# Time: the engine gives the time the named tests may take together
# (budget_seconds), which run-tests.py keeps (--budget); a test it stops for
# that, or does not start, is said so in the results. The step that runs the
# tests and the job have limits of their own, the repository variables
# HALO_FAST_TEST_MINUTES and HALO_FAST_JOB_MINUTES, which are 15 and 20 where
# they are not set: the step's is met first, so the results are still
# written; the job's ends a job that hangs.
#
# It runs only by hand, never on a pull request: the repository is public,
# and a trigger by a pull request would run anyone's code on the owner's
# machine.
name: fast
run-name: fast ${{ inputs.call }}

on:
  workflow_dispatch:
    inputs:
      commit:
        description: The commit to check out and test, pushed to a branch of the repository already
        required: true
      call:
        description: A value only the request that asks for this run knows, which the run's name holds
        required: true
      tests:
        description: The tests to run, each name followed by a line break
        required: false
        default: ''
      test_stop:
        description: How long one test may run before it is stopped, in whole seconds; empty for no stop but the job's limit
        required: false
        default: ''
      budget_seconds:
        description: How long the named tests may take together, in whole seconds; empty for no budget but the step's limit
        required: false
        default: ''
      work:
        description: The engine's work this run is for, whose build it keeps; empty for a run a person asks for
        required: false
        default: ''

permissions:
  contents: read

# No concurrency group: each run is a request an agent waits for, which
# another request must not cancel.

jobs:
  tests:
    name: tests (14900k)
    runs-on: [self-hosted, 14900k]
    # The job's limit; the head of this file says where it is set.
    timeout-minutes: ${{ fromJSON(vars.HALO_FAST_JOB_MINUTES || '20') }}
    env:
      TESTS_JUNIT: ${{ github.workspace }}/build/test-results/tests (14900k).xml
      TESTS_SUITE: tests (14900k)
      TESTS_STOP: ${{ inputs.test_stop }}
      TESTS_BUDGET: ${{ inputs.budget_seconds }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          submodules: true
          fetch-depth: 0
          clean: false
          # No later step pushes, so the token is not left in the checkout,
          # which the runner keeps.
          persist-credentials: false

      # The machine's runners share /tmp: msgpack's scratch, which the
      # Makefile puts in /tmp, is the job's own here. The runner context is
      # not available to a job's env, so the step names it.
      - name: Name the job's msgpack scratch
        run: echo "MSGPACK_SCRATCH=$RUNNER_TEMP/halo-msgpack-check" >> "$GITHUB_ENV"

      # The builds are kept outside the checkout, per work, so all of the
      # checkout's own goes, the results with it, since run-tests.py adds to
      # them.
      - name: Clear what the last run left
        run: |
          git clean -ffdxq
          git submodule foreach --quiet --recursive git clean -ffdxq

      # The work's build: HALO_BUILD for the Makefile, WHITEFOOT_CACHE for
      # the compiler's cache, made from main's where the work has none yet.
      - name: Use the build kept for this work
        env:
          WORK: ${{ inputs.work }}
        run: |
          state=$(.github/fast-state.sh use "$WORK")
          echo "FAST_STATE=$state" >> "$GITHUB_ENV"
          echo "HALO_BUILD=$state/build" >> "$GITHUB_ENV"
          echo "WHITEFOOT_CACHE=$state/cache" >> "$GITHUB_ENV"
          echo "The build of this run is kept in $state"

      # The names given, one a line, and whether they need the compiler.
      - name: Read the names
        id: names
        env:
          GIVEN: ${{ inputs.tests }}
        run: |
          printf '%s\n' "$GIVEN" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | awk 'NF && !seen[$0]++' \
            > "$RUNNER_TEMP/names"
          echo "Named:"
          cat "$RUNNER_TEMP/names"
          compiler=false
          while IFS= read -r name; do
            case "$name" in
              design-lint|design-ready|pin-ready|gate-parts) ;;
              *) compiler=true ;;
            esac
          done < "$RUNNER_TEMP/names"
          echo "compiler=$compiler" >> "$GITHUB_OUTPUT"

      # As design-readiness.yml names it, for the design checks.
      - name: Name main as a local ref
        run: |
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          git branch -f main origin/main

      # The design checks review the commit as a work branch is reviewed:
      # against its fork point from main.
      - name: Select the design review base
        run: |
          design_review_base=$(git merge-base refs/remotes/origin/main HEAD)
          echo "DESIGN_REVIEW_BASE=$design_review_base" >> "$GITHUB_ENV"
          git log --oneline -1 "$design_review_base"

      # The pinned release's Linux compiler runs /usr/bin/clang and links
      # with LLD of the LLVM major its manifest names. The machine keeps its
      # own, which no job may change, so the job checks it (make
      # toolchain-check, which downloads the compiler first when the work's
      # build lacks it, holding the work's lock) and installs nothing.
      - name: Download the pinned compiler and check the machine's LLVM
        if: steps.names.outputs.compiler == 'true'
        run: |
          .github/fast-state.sh lock "$FAST_STATE" make toolchain-check
          ld.lld --version
          /usr/bin/clang --version
          python3 --version

      # The reference Lua's build and msgpack's run `cc`. Where the machine
      # has none, `cc` is its /usr/bin/clang, through a link in the job's own
      # directory.
      - name: Name a C compiler cc
        if: steps.names.outputs.compiler == 'true'
        run: |
          if ! command -v cc > /dev/null; then
            mkdir -p "$RUNNER_TEMP/cc"
            ln -sf /usr/bin/clang "$RUNNER_TEMP/cc/cc"
            echo "$RUNNER_TEMP/cc" >> "$GITHUB_PATH"
            echo "cc is /usr/bin/clang"
          fi
          "$(command -v cc || echo "$RUNNER_TEMP/cc/cc")" --version | head -n 1

      # The step's limit is met before the job's, so the next step still
      # writes the results; the head of this file says where it is set. Two
      # runs of one work take turns here, on the work's lock.
      - name: Test
        timeout-minutes: ${{ fromJSON(vars.HALO_FAST_TEST_MINUTES || '15') }}
        run: |
          # A kit from before --budget would refuse it; the step's limit
          # then holds alone.
          budget=()
          if [ -n "$TESTS_BUDGET" ]; then
            if grep -q -- '--budget' whitefoot-kit/ci/run-tests.py; then
              budget=(--budget "$TESTS_BUDGET")
            else
              echo "::warning::whitefoot-kit's run-tests.py has no --budget; the budget of $TESTS_BUDGET s is not kept"
            fi
          fi
          .github/fast-state.sh lock "$FAST_STATE" \
            whitefoot-kit/ci/run-tests.py "${budget[@]}" --names "$RUNNER_TEMP/names"

      - name: Name the job's end in its results
        if: ${{ !cancelled() }}
        env:
          STATUS: ${{ job.status }}
        run: whitefoot-kit/ci/run-tests.py --end "$STATUS"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: build/test-results/
          if-no-files-found: ignore
          retention-days: 14

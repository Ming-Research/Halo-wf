# Temporary (board item wf-req-halo-check-time): records the new compiler's
# check-work TSV for Halo's VM test module (pkg::test), whose check time
# rose 225x between wf-d837678c6905 and wf-af7665be672d (run 38408841823).
# Removed once Whitefoot has the TSV.
name: checktime-probe
on:
  push:
    branches: [claude/halo-checktime-probe]
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Compiler
        run: |
          lscpu | grep 'Model name'
          for rel in wf-d837678c6905 wf-af7665be672d; do
            echo "release = $rel" > whitefoot.pin
            make toolchain >/dev/null
            make compiler
          done
      - name: Check pkg::test with check-work recording, old then new
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          set +e
          for rel in wf-d837678c6905 wf-af7665be672d; do
            export WHITEFOOT_CHECK_WORK="$RUNNER_TEMP/out/work-pkg-test-$rel.tsv"
            s=$(date +%s.%N)
            build/whitefoot/$rel/whitefootc --graph tests/halo-vm/modules.wfg --check-module pkg::test --report > "$RUNNER_TEMP/out/report-$rel.txt" 2> "$RUNNER_TEMP/out/stderr-$rel.txt"
            echo "$rel exit $? seconds $(echo "$(date +%s.%N) - $s" | bc)"
            wc -l "$WHITEFOOT_CHECK_WORK" || true
            tail -3 "$RUNNER_TEMP/out/stderr-$rel.txt"
          done
          ls -la "$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-work-pkg-test
          path: ${{ runner.temp }}/out/
          retention-days: 14

# Temporary (board item wf-req-halo-check-time): records the new compiler's
# check-work TSV for Halo's VM test module (pkg::test), whose check time
# rose 225x between wf-d837678c6905 and wf-af7665be672d (run 38408841823).
# Removed once Whitefoot has the TSV.
name: checktime-probe
on:
  push:
    branches: [claude/halo-checktime-probe]
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Compiler
        run: |
          lscpu | grep 'Model name'
          echo "release = wf-af7665be672d" > whitefoot.pin
          make toolchain >/dev/null
          make compiler
      - name: Check pkg::test with check-work recording
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          export WHITEFOOT_CHECK_WORK="$RUNNER_TEMP/out/work-pkg-test.tsv"
          s=$(date +%s.%N)
          set +e
          build/whitefoot/wf-af7665be672d/whitefootc --graph tests/halo-vm/modules.wfg --check-module pkg::test --report > "$RUNNER_TEMP/out/report.txt" 2> "$RUNNER_TEMP/out/stderr.txt"
          echo "exit $? seconds $(echo "$(date +%s.%N) - $s" | bc)"
          ls -la "$RUNNER_TEMP/out"
          wc -l "$WHITEFOOT_CHECK_WORK" || true
          head -3 "$WHITEFOOT_CHECK_WORK" || true
          tail -5 "$RUNNER_TEMP/out/stderr.txt"
          sort -t$'\t' -k2 -rn "$WHITEFOOT_CHECK_WORK" 2>/dev/null | head -15 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-work-pkg-test
          path: ${{ runner.temp }}/out/
          retention-days: 14

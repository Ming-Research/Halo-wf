# Temporary, for Halo-wf#5 only: builds the research hosts whose Outcome and
# HostOutcome matches the pending host call changed (halo-vm, halo-lib,
# halo-bench), which no gate builds, and runs halo-vm's smoke and suite.
# Removed before the pull request is marked ready.
name: research-build

on:
  push:
    branches: [claude/host-call]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install the host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld
      - name: Download the pinned compiler
        run: make compiler
      - name: Build and run
        run: |
          wfc=$(ls -d "$PWD"/build/whitefoot/wf-*/whitefootc | head -1)
          out="$PWD/build/research"
          mkdir -p "$out"
          status=0
          for target in halo-vm:smoke halo-vm:suite halo-lib:run halo-bench:bench; do
            dir=${target%%:*}; entry=${target##*:}
            if (cd "research/experiments/$dir" && "$wfc" --graph modules.wfg --entry "$entry" -o "$out/$dir-$entry"); then
              echo "build $dir $entry: ok"
            else
              echo "build $dir $entry: failed"; status=1
            fi
          done
          for program in halo-vm-smoke halo-vm-suite; do
            if [ -x "$out/$program" ]; then
              if "$out/$program"; then echo "run $program: exit 0"; else echo "run $program: exit $?"; status=1; fi
            fi
          done
          exit $status

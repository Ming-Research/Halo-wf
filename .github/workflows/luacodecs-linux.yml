# Temporary: runs the codec compatibility corpus (research/experiments/
# halo-luacodecs) on x86-64 Linux against Redis 7.0.15's bundled Lua built
# from source, to qualify its macOS-only results. Removed before
# claude/slice1 is ready; the results go to the experiment's RESULTS.md.
name: luacodecs-linux

on:
  push:
    branches: [claude/slice1]
    paths:
      - .github/workflows/luacodecs-linux.yml
      - research/experiments/halo-luacodecs/**
      - lib/**

defaults:
  run:
    shell: bash

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install the host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld

      - name: Download the pinned compiler
        run: |
          make compiler
          echo "WHITEFOOTC=$PWD/build/whitefoot/$(sed -n 's/^release = //p' whitefoot.pin)/whitefootc" >> "$GITHUB_ENV"

      - name: Fetch Redis 7.0.15 source
        run: |
          set -o pipefail
          mkdir -p build/redis && cd build/redis
          curl -fsSL --retry 3 -o redis-7.0.15.tar.gz https://download.redis.io/releases/redis-7.0.15.tar.gz
          expected=$(curl -fsSL --retry 3 https://raw.githubusercontent.com/redis/redis-hashes/master/README \
            | awk '$2 == "redis-7.0.15.tar.gz" && $3 == "sha256" { print $4 }')
          test -n "$expected"
          echo "$expected  redis-7.0.15.tar.gz" | sha256sum -c -
          tar -xzf redis-7.0.15.tar.gz

      - name: Compare
        continue-on-error: true
        run: |
          mkdir -p build/luacodecs
          python3 -B research/experiments/halo-luacodecs/run.py --compiler "$WHITEFOOTC" \
            --redis-source "$PWD/build/redis/redis-7.0.15" \
            --report "$PWD/build/luacodecs/RESULTS.md" --actual "$PWD/build/luacodecs/actual"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: luacodecs-linux
          path: build/luacodecs/
          retention-days: 30

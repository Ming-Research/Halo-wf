# Temporary (halo-main-compiler-names): checks every module graph of the
# repository with the newest Whitefoot main release, which contains the
# prelude `clear` of Whitefoot#486. The pin in the repository is not moved:
# the workspace's whitefoot.pin is rewritten for this run only.
#
# `check` is the acceptance check on the tree as pushed. `discover` finds every
# OP-5 site by repairing a disposable workspace round by round
# (.github/tmp-op5-discover.py) and keeps the repairs as a patch for review; it
# is removed once the sites are in the repository. The witnesses graph holds
# probes that are refused on purpose, so its result does not fail the run.
name: tmp-halo-main-compiler-names

on:
  push:

concurrency:
  group: tmp-halo-main-compiler-names-${{ github.ref }}
  cancel-in-progress: false

env:
  MAIN_RELEASE: wf-63b7cbb03820

jobs:
  check:
    name: check ${{ matrix.graph }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: ${{ matrix.graph == 'research/experiments/halo-coroutines/witnesses' }}
    strategy:
      fail-fast: false
      matrix:
        graph:
          - lib/fpconv
          - lib/halo
          - lib/halo/number/tests
          - lib/json
          - lib/msgpack
          - tests/halo-bench
          - tests/halo-e2e
          - tests/halo-lib
          - tests/halo-vm
          - tests/json
          - tests/msgpack
          - research/experiments/halo-compile
          - research/experiments/halo-coroutines/witnesses
          - research/experiments/halo-gc
          - research/experiments/halo-heap-core
          - research/experiments/halo-lex
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Download the main release's compiler
        run: |
          echo "release = $MAIN_RELEASE" > whitefoot.pin
          make toolchain
          cat build/whitefoot/$MAIN_RELEASE/whitefoot-release.json

      # `--check-modules` stops at a graph's first refused module, so each
      # own module is also checked alone, to list every refusal of one run.
      - name: Check the graph
        run: |
          wfc="$PWD/build/whitefoot/$MAIN_RELEASE/whitefootc"
          graph=${{ matrix.graph }}
          failed=0
          echo "::group::$graph --check-modules"
          if (cd "$graph" && "$wfc" --graph modules.wfg --check-modules); then
            echo "PASS $graph (graph)"
          else
            echo "FAIL $graph (graph)"; failed=1
          fi
          echo "::endgroup::"
          for module in $(sed -n -E 's/^pkg::([a-z0-9_]+):.*/\1/p' "$graph/modules.wfg"); do
            echo "::group::$graph pkg::$module"
            if (cd "$graph" && "$wfc" --graph modules.wfg --check-module "pkg::$module"); then
              echo "PASS $graph pkg::$module"
            else
              echo "FAIL $graph pkg::$module"; failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed

  discover:
    name: discover ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: research-lex, graph: research/experiments/halo-lex, modules: "dump"}
          - {name: research-compile, graph: research/experiments/halo-compile, modules: "dump"}
          - {name: research-heap-core, graph: research/experiments/halo-heap-core, modules: "test"}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Download the main release's compiler
        run: |
          echo "release = $MAIN_RELEASE" > whitefoot.pin
          make toolchain

      - name: Repair every OP-5 site of the modules
        run: |
          wfc="$PWD/build/whitefoot/$MAIN_RELEASE/whitefootc"
          python3 -B .github/tmp-op5-discover.py 300 "$wfc" ${{ matrix.graph }} module ${{ matrix.modules }}
          git diff -- . ':!whitefoot.pin' > build/op5.patch
          git diff --stat -- . ':!whitefoot.pin'

      - uses: actions/upload-artifact@v4
        with:
          name: op5-${{ matrix.name }}
          path: build/op5.patch
          retention-days: 7

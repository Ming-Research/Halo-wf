# Temporary, on this branch only: removed before the branch is ready. Board
# item halo-beat-puc-work. In the 2026-10-12 fastest-interpreter baseline
# (research/experiments/halo-bench/RESULTS.md) Halo's time on the
# are-we-fast-yet programs List and Towers is 1.70x and 1.61x PUC Lua 5.1.5's.
# This workflow finds where that time goes, before any change: callgrind of
# Halo's bench host (pinned compiler, full LTO) and of PUC 5.1.5 (Redis
# 7.2.16's bundled Lua, as the baseline used) on both programs, on a hosted
# x86-64 runner. It reads instruction counts, never times. Inner iterations
# are reduced to LIST_INNER and TOWERS_INNER (the bench's 1000 and 300) so
# each callgrind run takes minutes; Halo and PUC run identical bundle bytes.
name: awfy-profile

on:
  push:
    branches: [claude/halo-list-towers]
    paths:
      - .github/workflows/awfy-profile.yml

defaults:
  run:
    shell: bash

env:
  LIST_INNER: 200
  TOWERS_INNER: 60

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Install the host toolchain and valgrind
        run: |
          set -uo pipefail
          make toolchain
          sudo apt-get update -q
          sudo apt-get install -y -q valgrind binutils

      - name: Build Halo's bench host and PUC Lua 5.1.5
        run: |
          set -euo pipefail
          out="$PWD/build/awfy-profile"
          rm -rf "$out"; mkdir -p "$out/callgrind"
          release=$(sed -n 's/^release = //p' whitefoot.pin)
          make compiler
          make toolchain-check
          wfc="$PWD/build/whitefoot/$release/whitefootc"
          SECONDS=0
          "$wfc" --graph research/experiments/halo-bench/modules.wfg --entry bench --full-lto -o "$out/halo"
          echo "Halo full-LTO build: ${SECONDS} s"
          sh research/experiments/halo-oracle/fetch-redis.sh "$PWD/build/redis"
          cp build/redis/redis-7.2.16/deps/lua/src/lua "$out/puc"
          {
            echo "head $(git rev-parse HEAD), compiler $release, LIST_INNER $LIST_INNER, TOWERS_INNER $TOWERS_INNER"
            sha256sum "$wfc" "$out/halo" "$out/puc"
            file "$out/halo" "$out/puc"
            /usr/bin/clang --version | head -n 1
            uname -a
            valgrind --version || true
          } | tee "$out/manifest.txt"

      - name: Generate the List and Towers bundles with a reduced iteration count
        run: |
          set -euo pipefail
          out="$PWD/build/awfy-profile"
          # awfy.py writes the bench's bundles (List 1000, Towers 300 inner
          # iterations); only the driver's iteration argument is replaced, the
          # same bytes then go to both engines.
          python3 -B research/experiments/halo-bench/awfy.py --checkout build/awfy-src --out build/awfy-bundles
          for pair in "List:$LIST_INNER:1000" "Towers:$TOWERS_INNER:300"; do
            IFS=: read -r name n full <<< "$pair"
            sed "s/^assert(require(\"${name,,}\"):inner_benchmark_loop($full),\$/assert(require(\"${name,,}\"):inner_benchmark_loop($n),/" \
              "build/awfy-bundles/$name.lua" > "$out/$name.lua"
            grep -q "inner_benchmark_loop($n)," "$out/$name.lua"
            ! cmp -s "build/awfy-bundles/$name.lua" "$out/$name.lua"
          done
          sha256sum "$out/List.lua" "$out/Towers.lua" | tee -a "$out/manifest.txt"

      - name: Check both engines verify each program
        run: |
          set -euo pipefail
          out="$PWD/build/awfy-profile"
          # The bundle's driver asserts the benchmark's own result check on
          # every inner iteration and prints 1 only when all verified, as in
          # the bench; expect exactly 1 from both engines.
          for prog in List Towers; do
            "$out/halo" < "$out/$prog.lua" > "$out/check-halo-$prog.out" 2> "$out/check-halo-$prog.err"
            "$out/puc" "$out/$prog.lua" > "$out/check-puc-$prog.out" 2> "$out/check-puc-$prog.err"
            echo "$prog: halo '$(cat "$out/check-halo-$prog.out")', puc '$(cat "$out/check-puc-$prog.out")'; halo stderr: $(tr '\n' ' ' < "$out/check-halo-$prog.err")"
            test "$(cat "$out/check-halo-$prog.out")" = 1
            test "$(cat "$out/check-puc-$prog.out")" = 1
          done

      - name: Profile with callgrind
        run: |
          set -uo pipefail
          out="$PWD/build/awfy-profile"
          cg="$out/callgrind"
          : > "$cg/ir.txt"
          for prog in List Towers; do
            for engine in halo puc; do
              run="$engine-$prog"
              if [ "$engine" = halo ]; then cmd=("$out/halo"); inp="$out/$prog.lua"; else cmd=("$out/puc" "$out/$prog.lua"); inp=/dev/null; fi
              SECONDS=0
              valgrind --tool=callgrind --dump-instr=yes --collect-jumps=no --compress-strings=no --compress-pos=no \
                --callgrind-out-file="$cg/$run.out" "${cmd[@]}" < "$inp" > "$cg/$run.stdout" 2> "$cg/$run.stderr"
              echo "== callgrind $run: exit $?, ${SECONDS} s, printed $(cat "$cg/$run.stdout")"
              tail -n 4 "$cg/$run.stderr"
              ir=$(sed -n 's/^==[0-9]*== Collected : *\([0-9]*\).*/\1/p' "$cg/$run.stderr")
              echo "$run $ir" >> "$cg/ir.txt"
              callgrind_annotate --inclusive=no "$cg/$run.out" 2>&1 | head -n 90 > "$cg/$run-exclusive.txt" || true
              callgrind_annotate --inclusive=yes "$cg/$run.out" 2>&1 | head -n 90 > "$cg/$run-inclusive.txt" || true
              # Source annotation needs debug info: best effort, capped.
              callgrind_annotate --auto=yes --inclusive=no "$cg/$run.out" 2>&1 | head -c 4000000 > "$cg/$run-auto.txt" || true
            done
          done

      - name: Summary
        run: |
          set -uo pipefail
          cg="$PWD/build/awfy-profile/callgrind"
          {
            echo "whole-program Ir (callgrind 'Collected'); LIST_INNER $LIST_INNER, TOWERS_INNER $TOWERS_INNER"
            for prog in List Towers; do
              h=$(awk -v k="halo-$prog" '$1 == k { print $2 }' "$cg/ir.txt")
              p=$(awk -v k="puc-$prog" '$1 == k { print $2 }' "$cg/ir.txt")
              python3 -c "h,p=int('${h:-0}'),int('${p:-0}')
          print('$prog: halo %d, puc %d, halo/puc %s' % (h, p, '%.3f' % (h/p) if p else 'n/a'))"
            done
            for run in halo-List puc-List halo-Towers puc-Towers; do
              echo; echo "== $run exclusive top 15"
              grep -A22 -m1 'Ir ' "$cg/$run-exclusive.txt" | head -n 22
            done
          } | tee "$cg/summary.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: awfy-profile
          path: |
            build/awfy-profile/
            !build/awfy-profile/halo
            !build/awfy-profile/puc
          if-no-files-found: ignore
          retention-days: 30

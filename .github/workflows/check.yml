# Halo's gate: every push runs the checks of `make check` as eight parallel
# jobs (Makefile), each after downloading the pinned Whitefoot compiler
# release: the core group, the reference group and the parts of the extended
# group, so that no job compiles more than about two test programs. Each check
# is in exactly one job. The exact revision that merges into main passes all
# eight first (the owner-wide merge requirements).
name: check

on:
  push:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check-${{ matrix.part }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # `artifacts` lists what a failed job keeps: the end-to-end reports
        # and replies, or the roots controls' logs, or the reference build's.
        include:
          - part: core
            artifacts: |
              build/halo-e2e/*.md
              build/halo-e2e/ordinary/
              build/halo-e2e/stress/
          - part: roots-base
            artifacts: |
              build/halo-roots/*.log
          - part: roots-mutant-open-upvalues
            artifacts: |
              build/halo-roots/*.log
          - part: roots-mutant-frame-closure
            artifacts: |
              build/halo-roots/*.log
          - part: roots-mutant-constants
            artifacts: |
              build/halo-roots/*.log
          - part: hosts-vm
            artifacts: ""
          - part: hosts-lib-json
            artifacts: ""
          - part: reference
            artifacts: |
              build/redis/lua-build.log
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Name main as a local ref
        run: git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main

      # A work branch is reviewed against its fork point from main; a main
      # push against its previous tip.
      - name: Select the design review base
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          design_review_base=$(sh design/skill/review-base.sh "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$PUSH_BEFORE")
          echo "DESIGN_REVIEW_BASE=$design_review_base" >> "$GITHUB_ENV"
          git log --oneline -1 "$design_review_base"

      # The pinned release's Linux compiler runs /usr/bin/clang and links
      # with LLD of the LLVM major its manifest names; make toolchain
      # installs that major (whitefoot-kit, whitefoot.mk).
      - name: Install the host toolchain
        run: |
          make toolchain
          ld.lld --version
          python3 --version

      - name: Check
        run: make -k check-${{ matrix.part }}

      # A failed comparison is read from the runner's report and the actual
      # replies it kept, which the job's log only summarizes.
      - name: Keep the end-to-end reports and replies
        if: failure() && matrix.artifacts != ''
        uses: actions/upload-artifact@v4
        with:
          name: halo-${{ matrix.part }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: ignore
          retention-days: 14

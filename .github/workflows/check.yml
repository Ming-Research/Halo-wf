# Halo's gate: every push runs the checks of `make check` as eight parallel
# jobs, one per part of the Makefile's GATE_PARTS, each after downloading the
# pinned Whitefoot compiler release: the core group, the reference group and
# the parts of the extended group, so that no job builds more than three
# Whitefoot programs, nor more than one end-to-end test program. Each check is
# in exactly one job; the core group's gate-parts check fails when this
# matrix's parts differ from GATE_PARTS. The exact revision that merges into
# main passes all eight first (the owner-wide merge requirements). A push to a
# branch the engine of wf-agents makes (`work-…`, `wf-try/…`) runs nothing:
# the engine asks for the runs it needs by hand.
#
# It is also Halo's full workflow (`ci.full` of wf-agents.toml): before the
# engine merges a work, it runs this file as main holds it, by hand, with the
# commit to test and a value only its request knows, which the run's name
# holds. Each job runs the tests of its part (`make part-tests`), each by
# itself through whitefoot-kit/ci/run-tests.py, which writes what became of it
# as JUnit XML in a file named by the job; the job `results` gathers the files
# in the artifact `test-results`, which the engine reads.
name: check
run-name: ${{ inputs.call && format('check {0}', inputs.call) || '' }}

on:
  push:
    branches-ignore: ['work-*', 'wf-try/**']
    tags: ['**']
  workflow_dispatch:
    inputs:
      commit:
        description: The commit to check out and test; empty for the commit the run is asked on
        required: false
        default: ''
      call:
        description: A value only the request that asks for this run knows, which the run's name holds; empty for a run asked by hand
        required: false
        default: ''
      test_stop:
        description: How long one test may run before it is stopped, in whole seconds; empty for no stop but the job's limit
        required: false
        default: ''

# A newer push to the same branch makes the older run pointless; every run the
# engine asks for is kept.
concurrency:
  group: check-${{ inputs.call || github.ref }}
  cancel-in-progress: ${{ !inputs.call }}

jobs:
  check:
    name: make check-${{ matrix.part }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # `artifacts` lists what a failed job keeps: the end-to-end reports
        # and replies, or the roots controls' logs, or the reference build's.
        include:
          - part: core
            artifacts: |
              build/halo-e2e/*.md
              build/halo-e2e/ordinary/
              build/halo-e2e/stress/
          - part: roots-base
            artifacts: |
              build/halo-roots/*.log
          - part: roots-mutant-open-upvalues
            artifacts: |
              build/halo-roots/*.log
          - part: roots-mutant-frame-closure
            artifacts: |
              build/halo-roots/*.log
          - part: roots-mutant-constants
            artifacts: |
              build/halo-roots/*.log
          - part: hosts-vm
            artifacts: ""
          - part: hosts-lib-json
            artifacts: ""
          - part: reference
            artifacts: |
              build/redis/lua-build.log
    env:
      TESTS_JUNIT: ${{ github.workspace }}/build/test-results/make check-${{ matrix.part }}.xml
      TESTS_SUITE: make check-${{ matrix.part }}
      TESTS_STOP: ${{ inputs.test_stop }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit the engine gives; for any other run, empty, which is
          # the commit of the event.
          ref: ${{ inputs.commit }}
          submodules: true
          fetch-depth: 0

      - name: Name main as a local ref
        run: git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main

      # A work branch is reviewed against its fork point from main; a main
      # push against its previous tip. A commit the engine gives is reviewed
      # as a work branch is: the one it checks before a merge merges main into
      # the work's branch, so its first parent is not main.
      - name: Select the design review base
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          COMMIT: ${{ inputs.commit }}
        run: |
          if [ -n "$COMMIT" ]; then
            design_review_base=$(git merge-base refs/remotes/origin/main HEAD)
          else
            design_review_base=$(sh design/skill/review-base.sh "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$PUSH_BEFORE")
          fi
          echo "DESIGN_REVIEW_BASE=$design_review_base" >> "$GITHUB_ENV"
          git log --oneline -1 "$design_review_base"

      # The pinned release's Linux compiler runs /usr/bin/clang and links
      # with LLD of the LLVM major its manifest names; make toolchain
      # installs that major (whitefoot-kit, whitefoot.mk).
      - name: Install the host toolchain
        run: |
          make toolchain
          ld.lld --version
          python3 --version

      # The part's tests, each by itself and each whatever became of the one
      # before, as `make -k` ran them; `make toolchain` above downloaded the
      # compiler.
      - name: Check
        env:
          PART: ${{ matrix.part }}
        run: whitefoot-kit/ci/run-tests.py $(make -s --no-print-directory part-tests PART="$PART")

      # A failed comparison is read from the runner's report and the actual
      # replies it kept, which the job's log only summarizes.
      - name: Keep the end-to-end reports and replies
        if: failure() && matrix.artifacts != ''
        uses: actions/upload-artifact@v4
        with:
          name: halo-${{ matrix.part }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: ignore
          retention-days: 14

      - name: Name the job's end in its results
        if: ${{ !cancelled() }}
        env:
          STATUS: ${{ job.status }}
        run: whitefoot-kit/ci/run-tests.py --end "$STATUS"

      - name: Keep the job's results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.part }}
          path: build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # The JUnit of every job, in the one artifact the engine reads. It needs
  # every other job and judges nothing: it never fails the run.
  results:
    needs: check
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/upload-artifact/merge@v4
        continue-on-error: true
        with:
          name: test-results
          pattern: junit-*

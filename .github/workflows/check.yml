# Halo's gate: every push runs `make check` as its three groups, core,
# extended and reference, in parallel jobs (Makefile), after downloading the
# pinned Whitefoot compiler release. The exact revision that merges into main
# passes all three first (the owner-wide merge requirements).
name: check

on:
  push:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check-${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [core, extended, reference]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Name main as a local ref
        run: git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main

      # A work branch is reviewed against its fork point from main; a main
      # push against its previous tip.
      - name: Select the design review base
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          design_review_base=$(sh design/skill/review-base.sh "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$PUSH_BEFORE")
          echo "DESIGN_REVIEW_BASE=$design_review_base" >> "$GITHUB_ENV"
          git log --oneline -1 "$design_review_base"

      # The pinned release's Linux compiler runs /usr/bin/clang and links
      # with LLD of the LLVM major its manifest names; make toolchain
      # installs that major (whitefoot-kit, whitefoot.mk).
      - name: Install the host toolchain
        run: |
          make toolchain
          ld.lld --version
          python3 --version

      - name: Check
        run: make -k check-${{ matrix.group }}

      # A failed comparison is read from the runner's report and the actual
      # replies it kept, which the job's log only summarizes.
      - name: Keep the end-to-end reports and replies
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: halo-${{ matrix.group }}
          path: |
            build/halo-e2e/*.md
            build/halo-e2e/ordinary/
            build/halo-e2e/stress/
            build/halo-roots/*.log
            build/redis/lua-build.log
          if-no-files-found: ignore
          retention-days: 14

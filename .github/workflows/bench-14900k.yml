# Temporary, for Halo-wf#3: times research/experiments/halo-bench on the
# 14900K for the operand descriptions' runtime and check-time criterion
# (research/experiments/halo-bench/RESULTS.md, "Operand descriptions' cost").
# A push of this file runs it; this run follows the sort_compare_slow split.
# Removed before the pull request is marked ready.
name: bench-14900k

on:
  push:
    branches: [claude/fixed-call-entry]
    paths: [.github/workflows/bench-14900k.yml]

env:
  # Halo-wf main 526f67bef: the source without operand descriptions.
  BASE_SOURCE: 526f67befe929bfdb33513a0c557d832d4868c43

defaults:
  run:
    shell: bash

jobs:
  bench:
    runs-on: [self-hosted, 14900k]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      # Main, main with only the branch's _VERSION change, and this branch,
      # built by the same pinned release. Then sort.lua's three cumulative
      # prefixes on all three (eight rotating launches, time and collection
      # count), run.py's six-kernel comparison of the branch against main
      # with _VERSION, and binary-trees' collection counts at depths 12-16.
      - name: Build and compare
        run: |
          set -euo pipefail
          out="$PWD/build/bench-out"
          rm -rf "$out" build/main-src build/mainv-src
          mkdir -p "$out" build/main-src build/mainv-src
          release=$(sed -n 's/^release = //p' whitefoot.pin)
          make compiler
          make toolchain-check
          wfc="$PWD/build/whitefoot/$release/whitefootc"
          sh research/experiments/halo-oracle/fetch-redis.sh "$PWD/build/redis"
          lua="$PWD/build/redis/redis-7.0.15/deps/lua/src/lua"
          git archive "$BASE_SOURCE" | tar -x -C build/main-src
          git archive "$BASE_SOURCE" | tar -x -C build/mainv-src
          git diff "$BASE_SOURCE" HEAD -- lib/halo/vm/library.wf > "$out/version-only.patch"
          patch -p1 -d build/mainv-src < "$out/version-only.patch"
          grep -q '"_VERSION"' build/mainv-src/lib/halo/vm/library.wf
          (cd build/main-src && "$wfc" --graph research/experiments/halo-bench/modules.wfg --entry bench --full-lto -o "$out/halo-main")
          (cd build/mainv-src && "$wfc" --graph research/experiments/halo-bench/modules.wfg --entry bench --full-lto -o "$out/halo-mainv")
          "$wfc" --graph research/experiments/halo-bench/modules.wfg --entry bench --full-lto -o "$out/halo-names"
          {
            echo "branch $(git rev-parse HEAD), main source $BASE_SOURCE, release $release"
            sha256sum "$wfc" "$out"/halo-* "$out/version-only.patch"
            /usr/bin/clang --version | head -n 1
          } | tee "$out/manifest.txt"
          kernel=research/experiments/halo-bench/kernels/sort.lua
          sed -n '8p' "$kernel" | grep -qx 'table.sort(t)'
          { head -n 7 "$kernel"; echo 'print(t[N])'; } > "$out/sort-build.lua"
          { head -n 8 "$kernel"; echo 'print(t[1])'; } > "$out/sort-sort.lua"
          cp "$kernel" "$out/sort-full.lua"
          python3 - "$out" <<'PY' | tee "$out/phases.txt"
          import statistics, subprocess, sys, time
          out = sys.argv[1]
          sides = ['main', 'mainv', 'names']
          phases = ['build', 'sort', 'full']
          times = {(p, s): [] for p in phases for s in sides}
          counts = {(p, s): set() for p in phases for s in sides}
          for phase in phases:
              source = open(f'{out}/sort-{phase}.lua', 'rb').read()
              for i in range(8):
                  order = sides[i % 3:] + sides[:i % 3]
                  outputs = set()
                  for side in order:
                      start = time.perf_counter()
                      result = subprocess.run([f'{out}/halo-{side}'], input=source, capture_output=True)
                      elapsed = time.perf_counter() - start
                      if result.returncode != 0:
                          raise SystemExit(f'{side} {phase}: exit {result.returncode}: {result.stderr!r}')
                      outputs.add(result.stdout)
                      times[(phase, side)].append(elapsed)
                      counts[(phase, side)].add(result.stderr.decode().splitlines()[1])
                  if len(outputs) != 1:
                      raise SystemExit(f'{phase}: outputs differ: {outputs!r}')
          for phase in phases:
              for side in sides:
                  values = times[(phase, side)]
                  median = statistics.median(values)
                  spread = (max(values) - min(values)) / median
                  print(f'{phase} {side}: median {median:.6f} s, relative range {spread:.4f}, collections {sorted(counts[(phase, side)])}')
          PY
          python3 -B research/experiments/halo-bench/run.py --lua "$lua" \
            --before-binary "$out/halo-mainv" --binary "$out/halo-names" --kernels fib,loop,integer-table,string-key,concat,sort \
            --runs 1 --out "$out/vnames-1.json" --compiler "$wfc" > "$out/vnames-1.log" 2>&1 || { cat "$out/vnames-1.log"; exit 1; }
          for runs in 3 6; do
            python3 -B research/experiments/halo-bench/run.py --lua "$lua" \
              --before-binary "$out/halo-mainv" --binary "$out/halo-names" --kernels fib,loop,integer-table,string-key,concat,sort \
              --runs "$runs" --out "$out/vnames-$runs.json" --compiler "$wfc" > "$out/vnames-$runs.log" 2>&1 || { cat "$out/vnames-$runs.log"; exit 1; }
            echo "== main with _VERSION against the branch, $runs pair(s)"
            grep 'ratio=' "$out/vnames-$runs.log"
          done
          for depth in 12 13 14 15 16; do
            sed "s/^local N = 16$/local N = $depth/" research/experiments/halo-bench/kernels/binary-trees.lua > "$out/binary-trees-$depth.lua"
            grep -q "^local N = $depth$" "$out/binary-trees-$depth.lua"
            for side in main mainv names; do
              "$out/halo-$side" < "$out/binary-trees-$depth.lua" > "$out/bt-$side-$depth.out" 2> "$out/bt-$side-$depth.err"
              echo "binary-trees depth $depth $side: checksum $(cat "$out/bt-$side-$depth.out"), collections $(sed -n 2p "$out/bt-$side-$depth.err")" | tee -a "$out/collections.txt"
            done
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: halo-bench-version
          path: build/bench-out/
          retention-days: 30

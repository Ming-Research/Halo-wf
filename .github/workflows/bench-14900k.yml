# Temporary, for the Halo performance line: times research/experiments/
# halo-bench against PUC Lua on the 14900K (research/experiments/halo-bench/
# RESULTS.md, "P1 on the 14900K with wf-e1708490c384"): this run takes the
# profiles. A push of this file runs it. Removed before the pull request is marked ready.
name: bench-14900k

on:
  push:
    branches: [claude/halo-perf]
    paths: [.github/workflows/bench-14900k.yml]

defaults:
  run:
    shell: bash

jobs:
  bench:
    runs-on: [self-hosted, 14900k]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Build and compare with PUC
        run: |
          set -euo pipefail
          out="$PWD/build/bench-out"
          rm -rf "$out"; mkdir -p "$out"
          release=$(sed -n 's/^release = //p' whitefoot.pin)
          make compiler
          make toolchain-check
          wfc="$PWD/build/whitefoot/$release/whitefootc"
          sh research/experiments/halo-oracle/fetch-redis.sh "$PWD/build/redis"
          lua="$PWD/build/redis/redis-7.0.15/deps/lua/src/lua"
          "$wfc" --graph research/experiments/halo-bench/modules.wfg --entry bench --full-lto -o "$out/halo"
          {
            echo "branch $(git rev-parse HEAD), release $release"
            sha256sum "$wfc" "$out/halo" "$lua"
            /usr/bin/clang --version | head -n 1
            uname -a
            lscpu | grep -E 'Model name|^CPU\(s\)|MHz' || true
            echo "perf: $(command -v perf || echo absent)"
            perf --version 2>&1 || true
            echo "perf_event_paranoid: $(cat /proc/sys/kernel/perf_event_paranoid 2>/dev/null || echo unknown)"
            echo "objdump: $(command -v objdump || echo absent)"
          } | tee "$out/manifest.txt"
          kernels="fib loop integer-table string-key concat sort binary-trees"
          events=cycles,instructions,branches,branch-misses,L1-dcache-load-misses
          for kernel in $kernels; do
            src="$out/$kernel.lua"
            if [ "$kernel" = binary-trees ]; then
              sed 's/^local N = 16$/local N = 14/' "research/experiments/halo-bench/kernels/$kernel.lua" > "$src"
              grep -q '^local N = 14$' "$src"
            else
              cp "research/experiments/halo-bench/kernels/$kernel.lua" "$src"
            fi
            for i in 1 2 3; do
              perf stat -x, -e "$events" -o "$out/stat-puc-$kernel-$i.csv" "$lua" "$src" > /dev/null
              perf stat -x, -e "$events" -o "$out/stat-halo-$kernel-$i.csv" "$out/halo" < "$src" > /dev/null 2> "$out/halo-$kernel-$i.err"
            done
            perf record -q -e cycles -o "$out/perf-$kernel.data" "$out/halo" < "$src" > /dev/null 2> /dev/null
            perf report -q -i "$out/perf-$kernel.data" --no-children --sort symbol --percent-limit 0.5 --stdio 2> /dev/null | head -n 30 > "$out/report-$kernel.txt"
            echo "== $kernel"
            for side in puc halo; do
              echo "-- $side"; grep -h -v '^#' "$out"/stat-$side-$kernel-*.csv | grep -v '^$' | awk -F, '{print $3, $1}' | sort | awk '{a[$1]=a[$1]" "$2} END {for (k in a) print k a[k]}'
            done
            cat "$out/report-$kernel.txt"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: halo-bench-p1
          path: build/bench-out/
          retention-days: 30

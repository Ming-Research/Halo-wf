# Temporary, for the Halo performance line: the Whitefoot wf-0b7f5c5b9854
# upgrade's comparison (research/experiments/halo-bench/RESULTS.md,
# "Whitefoot wf-0b7f5c5b9854 upgrade"): this branch's source built with the
# old and the new release, a twin of the old build, all seven kernels, and
# the vm module-check time. A push of this file runs it. Removed before the
# pull request is marked ready.
name: bench-14900k

on:
  push:
    branches: [claude/halo-perf]
    paths: [.github/workflows/bench-14900k.yml]

env:
  OLD_RELEASE: wf-e1708490c384

defaults:
  run:
    shell: bash

jobs:
  bench:
    runs-on: [self-hosted, 14900k]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Build with both releases and compare
        run: |
          set -euo pipefail
          out="$PWD/build/bench-out"
          rm -rf "$out"; mkdir -p "$out"
          release=$(sed -n 's/^release = //p' whitefoot.pin)
          make compiler
          make compiler RELEASE="$OLD_RELEASE"
          make toolchain-check
          new="$PWD/build/whitefoot/$release/whitefootc"
          old="$PWD/build/whitefoot/$OLD_RELEASE/whitefootc"
          sh research/experiments/halo-oracle/fetch-redis.sh "$PWD/build/redis"
          lua="$PWD/build/redis/redis-7.0.15/deps/lua/src/lua"
          "$old" --graph research/experiments/halo-bench/modules.wfg --entry bench --full-lto -o "$out/halo-old"
          cp "$out/halo-old" "$out/halo-old-twin"
          "$new" --graph research/experiments/halo-bench/modules.wfg --entry bench --full-lto -o "$out/halo-new"
          {
            echo "branch $(git rev-parse HEAD), old $OLD_RELEASE, new $release"
            sha256sum "$old" "$new" "$out"/halo-*
            /usr/bin/clang --version | head -n 1
          } | tee "$out/manifest.txt"
          kernels=fib,loop,integer-table,string-key,concat,sort,binary-trees
          compare() {
            label=$1; before=$2; after=$3
            for runs in 1 3 6; do
              python3 -B research/experiments/halo-bench/run.py --lua "$lua" \
                --before-binary "$before" --binary "$after" --kernels "$kernels" \
                --scale binary-trees=14 --runs "$runs" --out "$out/$label-$runs.json" --compiler "$new" \
                > "$out/$label-$runs.log" 2>&1 || { cat "$out/$label-$runs.log"; exit 1; }
              echo "== $label, $runs pair(s)"
              grep 'ratio=' "$out/$label-$runs.log" | sed 's/ before=.*//'
            done
          }
          compare twin "$out/halo-old" "$out/halo-old-twin"
          compare upgrade "$out/halo-old" "$out/halo-new"
          TIMEFORMAT=%R
          for sample in 1 2; do
            for side in old new; do
              wfc=$old; [ "$side" = new ] && wfc=$new
              seconds=$( { time ("$wfc" --graph lib/halo/modules.wfg --check-module pkg::vm > "$out/check-$side-$sample.log" 2>&1); } 2>&1 )
              echo "check-module pkg::vm $side sample $sample: $seconds s" | tee -a "$out/check-times.txt"
            done
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: halo-bench-upgrade
          path: build/bench-out/
          retention-days: 30

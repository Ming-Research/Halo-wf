# Temporary, for the Halo performance line: the same source built with the
# pinned compiler and with the experiment release that reads by-value
# parameters in place, compared on the 14900K (research/experiments/
# halo-bench/RESULTS.md, "The entry copy of a by-value parameter, measured").
# A push of this file runs it. Removed before the pull request is marked ready.
name: bench-14900k

on:
  push:
    branches: [claude/halo-call]
    paths: [.github/workflows/bench-14900k.yml]

env:
  EXPERIMENT: wf-exp-5a3c70fc3351

defaults:
  run:
    shell: bash

jobs:
  bench:
    runs-on: [self-hosted, 14900k]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Build with both compilers and compare
        run: |
          set -euo pipefail
          out="$PWD/build/bench-out"
          rm -rf "$out"; mkdir -p "$out"
          pinned=$(sed -n 's/^release = //p' whitefoot.pin)
          make compiler
          make toolchain-check
          cp whitefoot.pin "$out/whitefoot.pin.orig"
          echo "release = $EXPERIMENT" > whitefoot.pin
          make compiler
          make toolchain-check
          cp "$out/whitefoot.pin.orig" whitefoot.pin
          wfc_pin="$PWD/build/whitefoot/$pinned/whitefootc"
          wfc_exp="$PWD/build/whitefoot/$EXPERIMENT/whitefootc"
          sh research/experiments/halo-oracle/fetch-redis.sh "$PWD/build/redis"
          lua="$PWD/build/redis/redis-7.0.15/deps/lua/src/lua"
          "$wfc_pin" --graph research/experiments/halo-bench/modules.wfg --entry bench --full-lto -o "$out/halo-pin"
          cp "$out/halo-pin" "$out/halo-pin-twin"
          "$wfc_exp" --graph research/experiments/halo-bench/modules.wfg --entry bench --full-lto -o "$out/halo-exp"
          {
            echo "branch $(git rev-parse HEAD), pinned $pinned, experiment $EXPERIMENT"
            sha256sum "$wfc_pin" "$wfc_exp" "$out"/halo-*
            /usr/bin/clang --version | head -n 1
          } | tee "$out/manifest.txt"
          for side in pin exp; do
            sym=$(nm "$out/halo-$side" | awk '/ [tT] wf_package\.halo\.vm\.push_frame$/ {print $3}')
            objdump -d --no-show-raw-insn -M intel --disassemble="$sym" "$out/halo-$side" > "$out/push_frame-$side.txt"
            echo "== push_frame, $side: $(grep -c -E '^ +[0-9a-f]+:' "$out/push_frame-$side.txt") instructions"
            head -n 30 "$out/push_frame-$side.txt"
          done
          kernels=fib,loop,integer-table,string-key,concat,sort,binary-trees
          compare() {
            label=$1; before=$2; after=$3
            for runs in 1 3 6; do
              python3 -B research/experiments/halo-bench/run.py --lua "$lua" \
                --before-binary "$before" --binary "$after" --kernels "$kernels" \
                --scale binary-trees=14 --runs "$runs" --out "$out/$label-$runs.json" --compiler "$wfc_pin" \
                > "$out/$label-$runs.log" 2>&1 || { cat "$out/$label-$runs.log"; exit 1; }
              echo "== $label, $runs pair(s)"
              grep 'ratio=' "$out/$label-$runs.log" | sed 's/ before=.*//'
            done
          }
          compare twin "$out/halo-pin" "$out/halo-pin-twin"
          compare inplace "$out/halo-pin" "$out/halo-exp"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: halo-bench-inplace
          path: build/bench-out/
          retention-days: 30

# Temporary: one closure lookup and in-place prototype reads per call on the
# 14900K (research/experiments/halo-bench/RESULTS.md, "One closure lookup and
# the prototype fields a call reads"), the source before the change against
# this branch with a twin, and both builds' call-path disassembly. A push of this file runs it,
# made only once the runner is confirmed idle. Removed before ready.
name: bench-14900k

on:
  push:
    branches: [claude/halo-call]
    paths: [.github/workflows/bench-14900k.yml]

env:
  # The criterion's commit: this branch's source before the change.
  BASE_SOURCE: 5f8ba808ced9c9d6d86fd6d0eb75bf71c18778b0

defaults:
  run:
    shell: bash

jobs:
  bench:
    runs-on: [self-hosted, 14900k]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Build and compare
        run: |
          set -euo pipefail
          out="$PWD/build/bench-out"
          rm -rf "$out" build/base-src
          mkdir -p "$out" build/base-src
          release=$(sed -n 's/^release = //p' whitefoot.pin)
          make compiler
          make toolchain-check
          wfc="$PWD/build/whitefoot/$release/whitefootc"
          sh research/experiments/halo-oracle/fetch-redis.sh "$PWD/build/redis"
          lua="$PWD/build/redis/redis-7.0.15/deps/lua/src/lua"
          git archive "$BASE_SOURCE" | tar -x -C build/base-src
          git diff --stat "$BASE_SOURCE" HEAD -- lib research/experiments/halo-bench/host research/experiments/halo-bench/modules.wfg | tee "$out/source-diff.txt"
          (cd build/base-src && "$wfc" --graph research/experiments/halo-bench/modules.wfg --entry bench --full-lto -o "$out/halo-base")
          cp "$out/halo-base" "$out/halo-base-twin"
          "$wfc" --graph research/experiments/halo-bench/modules.wfg --entry bench --full-lto -o "$out/halo-head"
          {
            echo "branch $(git rev-parse HEAD), base source $BASE_SOURCE, release $release"
            sha256sum "$wfc" "$out"/halo-*
            /usr/bin/clang --version | head -n 1
          } | tee "$out/manifest.txt"
          for side in base head; do
            for sym in enter_lua 'prepare$instance' native_binding; do
              name=$(nm "$out/halo-$side" | awk -v s="$sym" 'index($0, s) && $2 ~ /[tT]/ {print $3; exit}')
              [ -n "$name" ] || continue
              objdump -d --no-show-raw-insn -M intel --disassemble="$name" "$out/halo-$side" > "$out/disasm-$side-${sym%%\$*}.txt"
              echo "$side $name $(grep -c -E '^ +[0-9a-f]+:' "$out/disasm-$side-${sym%%\$*}.txt") instructions"
            done
          done | tee "$out/call-sizes.txt"
          kernels=fib,loop,integer-table,string-key,concat,sort,binary-trees
          compare() {
            label=$1; before=$2; after=$3
            for runs in 1 3 6; do
              python3 -B research/experiments/halo-bench/run.py --lua "$lua" \
                --before-binary "$before" --binary "$after" --kernels "$kernels" \
                --scale binary-trees=14 --runs "$runs" --out "$out/$label-$runs.json" --compiler "$wfc" \
                > "$out/$label-$runs.log" 2>&1 || { cat "$out/$label-$runs.log"; exit 1; }
              echo "== $label, $runs pair(s)"
              grep 'ratio=' "$out/$label-$runs.log" | sed 's/ before=.*//'
            done
          }
          compare twin "$out/halo-base" "$out/halo-base-twin"
          compare onelookup "$out/halo-base" "$out/halo-head"
          TIMEFORMAT=%R
          for sample in 1 2; do
            for side in base head; do
              dir=build/base-src; [ "$side" = head ] && dir=.
              seconds=$( { time (cd "$dir" && "$wfc" --graph lib/halo/modules.wfg --check-module pkg::vm > "$out/check-$side-$sample.log" 2>&1); } 2>&1 )
              echo "check-module pkg::vm $side sample $sample: $seconds s" | tee -a "$out/check-times.txt"
            done
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: halo-bench-onelookup
          path: build/bench-out/
          retention-days: 30

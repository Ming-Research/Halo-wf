# Temporary, for Halo-wf#3: times research/experiments/halo-bench on the
# 14900K for the operand descriptions' runtime and check-time criterion
# (research/experiments/halo-bench/RESULTS.md, "Operand descriptions' cost").
# A push of this file runs it; this run localizes sort's difference by phase.
# Removed before the pull request is marked ready.
name: bench-14900k

on:
  push:
    branches: [claude/fixed-call-entry]
    paths: [.github/workflows/bench-14900k.yml]

env:
  # Halo-wf main 526f67bef: the source without operand descriptions.
  BASE_SOURCE: 526f67befe929bfdb33513a0c557d832d4868c43

defaults:
  run:
    shell: bash

jobs:
  bench:
    runs-on: [self-hosted, 14900k]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      # Main and this branch built by the same pinned release, then three
      # cumulative prefixes of sort.lua (build; build and sort; the whole
      # kernel), eight interleaved launches each per binary.
      - name: Build and time sort's phases
        run: |
          set -euo pipefail
          out="$PWD/build/bench-out"
          rm -rf "$out" build/main-src
          mkdir -p "$out" build/main-src
          release=$(sed -n 's/^release = //p' whitefoot.pin)
          make compiler
          make toolchain-check
          wfc="$PWD/build/whitefoot/$release/whitefootc"
          git archive "$BASE_SOURCE" | tar -x -C build/main-src
          (cd build/main-src && "$wfc" --graph research/experiments/halo-bench/modules.wfg --entry bench --full-lto -o "$out/halo-main")
          "$wfc" --graph research/experiments/halo-bench/modules.wfg --entry bench --full-lto -o "$out/halo-names"
          {
            echo "branch $(git rev-parse HEAD), main source $BASE_SOURCE, release $release"
            sha256sum "$wfc" "$out"/halo-*
            /usr/bin/clang --version | head -n 1
          } | tee "$out/manifest.txt"
          kernel=research/experiments/halo-bench/kernels/sort.lua
          sed -n '8p' "$kernel" | grep -qx 'table.sort(t)'
          { head -n 7 "$kernel"; echo 'print(t[N])'; } > "$out/sort-build.lua"
          { head -n 8 "$kernel"; echo 'print(t[1])'; } > "$out/sort-sort.lua"
          cp "$kernel" "$out/sort-full.lua"
          python3 - "$out" <<'PY' | tee "$out/phases.txt"
          import statistics, subprocess, sys, time
          out = sys.argv[1]
          phases = ['build', 'sort', 'full']
          times = {(p, s): [] for p in phases for s in ('main', 'names')}
          for phase in phases:
              source = open(f'{out}/sort-{phase}.lua', 'rb').read()
              for i in range(8):
                  order = ('main', 'names') if i % 2 == 0 else ('names', 'main')
                  outputs = {}
                  for side in order:
                      start = time.perf_counter()
                      result = subprocess.run([f'{out}/halo-{side}'], input=source, capture_output=True)
                      elapsed = time.perf_counter() - start
                      if result.returncode != 0:
                          raise SystemExit(f'{side} {phase}: exit {result.returncode}: {result.stderr!r}')
                      outputs[side] = result.stdout
                      times[(phase, side)].append(elapsed)
                  if outputs['main'] != outputs['names']:
                      raise SystemExit(f'{phase}: outputs differ: {outputs!r}')
          medians = {key: statistics.median(value) for key, value in times.items()}
          for phase in phases:
              for side in ('main', 'names'):
                  values = times[(phase, side)]
                  spread = (max(values) - min(values)) / medians[(phase, side)]
                  print(f'{phase} {side}: median {medians[(phase, side)]:.6f} s, relative range {spread:.4f}, runs {" ".join(f"{v:.6f}" for v in values)}')
          previous = {'main': 0.0, 'names': 0.0}
          for phase in phases:
              cost = {side: medians[(phase, side)] - previous[side] for side in ('main', 'names')}
              print(f'phase {phase}: main {cost["main"]:.6f} s, names {cost["names"]:.6f} s, difference {cost["names"] - cost["main"]:+.6f} s')
              previous = {side: medians[(phase, side)] for side in ('main', 'names')}
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: halo-bench-phases
          path: build/bench-out/
          retention-days: 30

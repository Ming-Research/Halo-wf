# Temporary: attribute the concat kernel's slowdown under wf-7062f3ac4ac7
# (research/experiments/halo-bench/RESULTS.md, "Whitefoot wf-7062f3ac4ac7
# upgrade"): cycle samples of the same source built by the old and the new
# release, with the hottest symbols annotated. The 14900K job runs only for a
# commit whose message contains [annotate], pushed once the runner is
# confirmed idle. Removed before the pull request is marked ready.
name: annotate-concat

on:
  push:
    branches: [claude/halo-pin-7062f3a]

env:
  CONTROL: wf-78223721f77d
  EXPERIMENT: wf-7062f3ac4ac7

defaults:
  run:
    shell: bash

jobs:
  annotate:
    if: contains(github.event.head_commit.message, '[annotate]')
    runs-on: [self-hosted, 14900k]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Sample concat under both releases
        run: |
          set -euo pipefail
          out="$PWD/build/annotate-out"
          rm -rf "$out"; mkdir -p "$out"
          cp whitefoot.pin "$out/whitefoot.pin.orig"
          for release in "$CONTROL" "$EXPERIMENT"; do
            echo "release = $release" > whitefoot.pin
            make compiler
            make toolchain-check
          done
          cp "$out/whitefoot.pin.orig" whitefoot.pin
          build/whitefoot/$CONTROL/whitefootc --graph research/experiments/halo-bench/modules.wfg --entry bench --full-lto -o "$out/halo-ctl"
          build/whitefoot/$EXPERIMENT/whitefootc --graph research/experiments/halo-bench/modules.wfg --entry bench --full-lto -o "$out/halo-exp"
          # Ten times the benchmark's iterations, so each side gets about
          # 35,000 samples; the source is otherwise the kernel's.
          sed 's/^local N = 1000000$/local N = 10000000/' research/experiments/halo-bench/kernels/concat.lua > "$out/concat-10x.lua"
          grep -q '^local N = 10000000$' "$out/concat-10x.lua"
          { echo "source $(git rev-parse HEAD), control $CONTROL, experiment $EXPERIMENT"; sha256sum "$out"/halo-* "$out/concat-10x.lua"; perf --version; } | tee "$out/manifest.txt"
          for side in ctl exp; do
            taskset -c 2 perf stat -x, -e cpu_core/cycles/,cpu_core/instructions/,cpu_core/event=0x03,umask=0x82,name=ld_blocks_store_forward/ \
              -o "$out/stat-$side.csv" "$out/halo-$side" < "$out/concat-10x.lua" > "$out/stat-$side.out"
            echo "== stat $side"; grep -v '^#' "$out/stat-$side.csv" | grep -v '^$'
            taskset -c 2 perf record -q -e cpu_core/cycles/ -c 100003 -o "$out/perf-$side.data" "$out/halo-$side" < "$out/concat-10x.lua" > "$out/run-$side.out" 2>&1
            { perf report -q -i "$out/perf-$side.data" --no-children --sort symbol --stdio 2>/dev/null || true; } > "$out/report-$side.txt"
            grep -E '^ +[0-9]' "$out/report-$side.txt" | head -n 20 > "$out/symbols-$side.txt" || true
            echo "== symbols $side"; head -n 12 "$out/symbols-$side.txt" || true
            awk 'NR <= 6 {print $3}' "$out/symbols-$side.txt" | while read -r sym; do
              file="$out/annotate-$side-$(echo "$sym" | sed 's/^wf_package\.halo\.vm\.//' | tr '$/' '__').txt"
              perf annotate -i "$out/perf-$side.data" --stdio --no-source -s "$sym" > "$file" 2>/dev/null || echo "annotate failed: $sym" > "$file"
              echo "== $side $sym: $(wc -l < "$file") lines"
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: halo-annotate-concat
          path: build/annotate-out/
          retention-days: 30

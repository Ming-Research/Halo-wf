# Temporary, on this branch only: removed before the branch is ready. Board
# item halo-beat-puc-work. Times the change recorded in halo-bench/RESULTS.md,
# "Plain arithmetic and proven slot bounds at the Lua function entry": the base
# (BASE, main before the change) and this branch's head, built by the pinned
# compiler with full LTO, six interleaved pairs over the seven kernels (fib at
# N = 30, binary-trees at depth 14) with a twin of the base, every timed process
# on CPU 2. The 14900K job runs only for a push whose head commit subject
# starts with [bench] and that touches this file. Rerun once, unchanged, as
# RESULTS.md's "Rerun, recorded before it runs" states.
name: bench-entry

on:
  push:
    branches: [claude/halo-entry-saturation]
    paths:
      - .github/workflows/bench-entry.yml

env:
  BASE: 56878ac

defaults:
  run:
    shell: bash

jobs:
  bench:
    if: startsWith(github.event.head_commit.message, '[bench]')
    runs-on: [self-hosted, 14900k]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Build both sources with the pinned compiler and compare
        run: |
          set -euo pipefail
          out="$PWD/build/bench-out"
          rm -rf "$out"; mkdir -p "$out"
          make compiler
          make toolchain-check
          release=$(sed -n 's/^release = //p' whitefoot.pin)
          wfc="$PWD/build/whitefoot/$release/whitefootc"
          sh research/experiments/halo-oracle/fetch-redis.sh "$PWD/build/redis" 7.0.15
          lua="$PWD/build/redis/redis-7.0.15/deps/lua/src/lua"
          # Same compiler on both sides; only the source differs.
          # The self-hosted runner keeps .git between jobs; drop a registration a
          # previous job left for build/base-src.
          git worktree prune
          git worktree add --detach "$PWD/build/base-src" "$BASE"
          (cd build/base-src && "$wfc" --graph research/experiments/halo-bench/modules.wfg --entry bench --full-lto -o "$out/halo-base")
          cp "$out/halo-base" "$out/halo-base-twin"
          "$wfc" --graph research/experiments/halo-bench/modules.wfg --entry bench --full-lto -o "$out/halo-entry"
          {
            echo "base $(git rev-parse "$BASE"), experiment $(git rev-parse HEAD), compiler $release"
            sha256sum "$wfc" "$out"/halo-*
            /usr/bin/clang --version | head -n 1
          } | tee "$out/manifest.txt"
          # The 14900K is a hybrid part (P-cores CPU 0-15, E-cores 16-31): run
          # every timed process on one ordinary P-core thread, CPU 2, and
          # record the topology and frequency policy.
          lscpu -e=CPU,CORE,MAXMHZ > "$out/lscpu.txt" 2>&1 || true
          cat /sys/devices/system/cpu/cpufreq/policy*/scaling_governor 2>/dev/null | sort | uniq -c > "$out/governor.txt" || true
          pin="taskset -c 2"
          echo "timed processes pinned with: $pin" | tee -a "$out/manifest.txt"
          cat "$out/governor.txt" | tee -a "$out/manifest.txt"
          kernels=fib,loop,integer-table,string-key,concat,sort,binary-trees
          compare() {
            label=$1; before=$2; after=$3
            for runs in 1 3 6; do
              $pin python3 -B research/experiments/halo-bench/run.py --lua "$lua" \
                --before-binary "$before" --binary "$after" --kernels "$kernels" \
                --scale binary-trees=14 --runs "$runs" --out "$out/$label-$runs.json" --compiler "$wfc" \
                > "$out/$label-$runs.log" 2>&1 || { cat "$out/$label-$runs.log"; exit 1; }
              echo "== $label, $runs pair(s)"
              grep 'ratio=' "$out/$label-$runs.log" | sed 's/ before=.*//'
            done
          }
          compare twin "$out/halo-base" "$out/halo-base-twin"
          compare entry "$out/halo-base" "$out/halo-entry"
          TIMEFORMAT=%R
          for sample in 1 2; do
            for side in base entry; do
              dir="$PWD"; [ "$side" = base ] && dir="$PWD/build/base-src"
              seconds=$( { time (cd "$dir" && $pin "$wfc" --graph lib/halo/modules.wfg --check-module pkg::vm > "$out/check-$side-$sample.log" 2>&1); } 2>&1 )
              echo "check-module pkg::vm $side sample $sample: $seconds s" | tee -a "$out/check-times.txt"
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: halo-bench-entry
          path: build/bench-out/
          retention-days: 30

# Temporary, for the Halo performance line: profiles table growth on the
# 14900K (research/experiments/halo-bench/RESULTS.md, "The share of table
# growth on the 14900K"). A push of this file runs it, made only once the
# runner is confirmed idle. Removed before the pull request is marked ready.
name: profile-14900k

on:
  push:
    branches: [claude/halo-rehash]
    paths: [.github/workflows/profile-14900k.yml]

defaults:
  run:
    shell: bash

jobs:
  profile:
    runs-on: [self-hosted, 14900k]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Profile integer-table and binary-trees
        run: |
          set -euo pipefail
          out="$PWD/build/bench-out"
          rm -rf "$out"; mkdir -p "$out"
          release=$(sed -n 's/^release = //p' whitefoot.pin)
          make compiler
          make toolchain-check
          wfc="$PWD/build/whitefoot/$release/whitefootc"
          sh research/experiments/halo-oracle/fetch-redis.sh "$PWD/build/redis"
          start=$(date +%s)
          "$wfc" --graph research/experiments/halo-bench/modules.wfg --entry bench --full-lto -o "$out/halo"
          echo "full-LTO build: $(( $(date +%s) - start )) s"
          sed 's/^local N = 16$/local N = 14/' research/experiments/halo-bench/kernels/binary-trees.lua > "$out/binary-trees.lua"
          grep -q '^local N = 14$' "$out/binary-trees.lua"
          cp research/experiments/halo-bench/kernels/integer-table.lua "$out/integer-table.lua"
          {
            echo "branch $(git rev-parse HEAD), release $release"
            sha256sum "$wfc" "$out/halo" "$out"/*.lua
            /usr/bin/clang --version | head -n 1
            uname -a
            lscpu | grep -E 'Model name|^CPU\(s\)|MHz|Hypervisor' || true
            perf --version 2>&1 || true
            echo "perf_event_paranoid: $(cat /proc/sys/kernel/perf_event_paranoid 2>/dev/null || echo unknown)"
          } | tee "$out/manifest.txt"
          graph=lbr
          if ! perf record -q -e cycles --call-graph lbr -o "$out/probe.data" true 2> "$out/probe.err"; then
            graph=dwarf,16384
          fi
          echo "call graph: $graph" | tee -a "$out/manifest.txt"
          for kernel in integer-table binary-trees; do
            src="$out/$kernel.lua"
            for i in 1 2 3; do
              start=$(date +%s.%N)
              perf record -q -e cycles -o "$out/flat-$kernel-$i.data" "$out/halo" < "$src" > "$out/$kernel-$i.out" 2> "$out/$kernel-$i.err"
              end=$(date +%s.%N)
              perf record -q -e cycles --call-graph "$graph" -o "$out/graph-$kernel-$i.data" "$out/halo" < "$src" > /dev/null 2> /dev/null
              perf report -q -i "$out/flat-$kernel-$i.data" --no-children --sort symbol --percent-limit 0.3 --stdio 2> /dev/null > "$out/self-$kernel-$i.txt"
              perf report -q -i "$out/graph-$kernel-$i.data" --children --sort symbol --percent-limit 0.3 --stdio -g none 2> /dev/null > "$out/children-$kernel-$i.txt"
              echo "== $kernel launch $i: $(cat "$out/$kernel-$i.out"), $(awk -v a="$start" -v b="$end" 'BEGIN { printf "%.3f", b - a }') s"
              head -n 20 "$out/self-$kernel-$i.txt"
              echo "-- with children, table growth:"
              grep -E 'rehash|histogram|insert_parts|nodes_new|values_new|power_capacity' "$out/children-$kernel-$i.txt" || echo "(no growth symbol above 0.3%)"
            done
          done
          rm -f "$out"/graph-*.data

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: halo-growth-profile
          path: build/bench-out/
          retention-days: 30

# Temporary, for the Halo performance line: profiles table construction and
# growth on a hosted x86-64 runner (research/experiments/halo-bench/
# RESULTS.md, "Table construction and growth"); it reads shares of samples,
# not times. A push of this file runs it. Removed before the pull request is
# marked ready.
name: profile-tables

on:
  push:
    branches: [claude/halo-alloc]
    paths: [.github/workflows/profile-tables.yml]

defaults:
  run:
    shell: bash

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Install the host toolchain and perf
        run: |
          make toolchain
          sudo apt-get update -q
          sudo apt-get install -y -q "linux-tools-$(uname -r)" linux-tools-common
          sudo sysctl -w kernel.perf_event_paranoid=-1
          sudo sysctl -w kernel.kptr_restrict=0

      - name: Profile binary-trees and integer-table
        run: |
          set -euo pipefail
          out="$PWD/build/bench-out"
          rm -rf "$out"; mkdir -p "$out"
          release=$(sed -n 's/^release = //p' whitefoot.pin)
          make compiler
          make toolchain-check
          wfc="$PWD/build/whitefoot/$release/whitefootc"
          sh research/experiments/halo-oracle/fetch-redis.sh "$PWD/build/redis"
          lua="$PWD/build/redis/redis-7.0.15/deps/lua/src/lua"
          "$wfc" --graph research/experiments/halo-bench/modules.wfg --entry bench --full-lto -o "$out/halo"
          sed 's/^local N = 16$/local N = 14/' research/experiments/halo-bench/kernels/binary-trees.lua > "$out/binary-trees.lua"
          grep -q '^local N = 14$' "$out/binary-trees.lua"
          cp research/experiments/halo-bench/kernels/integer-table.lua "$out/integer-table.lua"
          {
            echo "branch $(git rev-parse HEAD), release $release"
            sha256sum "$wfc" "$out/halo" "$lua" "$out"/*.lua
            /usr/bin/clang --version | head -n 1
            uname -a
            lscpu | grep -E 'Model name|^CPU\(s\)|MHz' || true
            perf --version 2>&1 || true
          } | tee "$out/manifest.txt"
          for kernel in binary-trees integer-table; do
            src="$out/$kernel.lua"
            for i in 1 2 3; do
              perf record -q -o "$out/halo-$kernel-$i.data" "$out/halo" < "$src" > "$out/halo-$kernel-$i.out" 2> "$out/halo-$kernel-$i.err"
              perf record -q -o "$out/puc-$kernel-$i.data" "$lua" "$src" > "$out/puc-$kernel-$i.out" 2> "$out/puc-$kernel-$i.err"
              for side in halo puc; do
                perf report -q -i "$out/$side-$kernel-$i.data" --no-children --sort symbol --percent-limit 0.3 --stdio 2> /dev/null > "$out/report-$side-$kernel-$i.txt"
                echo "== $kernel $side launch $i: $(cat "$out/$side-$kernel-$i.out")"
                head -n 25 "$out/report-$side-$kernel-$i.txt"
              done
            done
            perf annotate -i "$out/halo-$kernel-1.data" --stdio 2> /dev/null > "$out/annotate-halo-$kernel.txt" || true
            perf annotate -i "$out/puc-$kernel-1.data" --stdio 2> /dev/null > "$out/annotate-puc-$kernel.txt" || true
          done
          nm -C "$out/halo" > "$out/halo-symbols.txt"
          grep -E ' [tT] .*(node_find|table_set|new_table|rehash|alloc_table|resize|main_position|get_free|collect_if_due|raw_assign|table_get|setnodevector|setarrayvector|numusearray|numusehash|computesizes)' "$out/halo-symbols.txt" | tee "$out/table-symbols.txt"
          awk '{print $3}' "$out/table-symbols.txt" | while read -r sym; do
            objdump -d --no-show-raw-insn -M intel --disassemble="$sym" "$out/halo" > "$out/disasm-$sym.txt" 2> /dev/null || true
            echo "$sym $(grep -c -E '^ +[0-9a-f]+:' "$out/disasm-$sym.txt") instructions"
          done | tee "$out/table-sizes.txt"
          nm "$lua" | grep -E ' [tT] (luaH_|luaM_|luaC_|newkey|rehash|resize|setnodevector|setarrayvector|computesizes|numusearray|numusehash|getfreepos|mainposition)' | tee "$out/puc-symbols.txt"
          awk '{print $3}' "$out/puc-symbols.txt" | while read -r sym; do
            objdump -d --no-show-raw-insn -M intel --disassemble="$sym" "$lua" > "$out/disasm-puc-$sym.txt" 2> /dev/null || true
            echo "$sym $(grep -c -E '^ +[0-9a-f]+:' "$out/disasm-puc-$sym.txt") instructions"
          done | tee -a "$out/table-sizes.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: halo-tables-profile
          path: build/bench-out/
          retention-days: 30

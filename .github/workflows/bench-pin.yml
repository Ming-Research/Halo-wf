# Temporary, on this upgrade branch only: removed before the branch is ready
# (status-board item halo-beat-puc-work). The same Halo source built by the
# previous pin wf-d837678c6905 (before) and the new pin wf-93e97efdc27b
# (after), one, three and six interleaved full-LTO pairs over the seven
# kernels with a twin of the old build, plus cycles, instructions and blocked
# store-forward counts on fib and integer-table, and the time of
# `--check-module pkg::vm` on each compiler. Derived from the
# wf-d837678c6905 upgrade's bench-upgrade.yml (commit 58174ff) without its
# reference release. It runs only when the head commit's subject starts with
# [bench] and the push touches this file. Question and criterion:
# research/experiments/halo-bench/RESULTS.md, "Whitefoot wf-93e97efdc27b
# upgrade".
name: bench-pin

on:
  push:
    branches: [claude/halo-pin-93e97ef]
    paths:
      - .github/workflows/bench-pin.yml

env:
  BEFORE: wf-d837678c6905
  AFTER: wf-93e97efdc27b

defaults:
  run:
    shell: bash

jobs:
  bench:
    if: startsWith(github.event.head_commit.message, '[bench]')
    runs-on: [self-hosted, 14900k]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Build with both compilers and compare
        run: |
          set -euo pipefail
          out="$PWD/build/bench-out"
          rm -rf "$out"; mkdir -p "$out"
          # Both compilers come from the kit by release name; whitefoot.pin
          # stays as committed (the after release).
          for release in "$BEFORE" "$AFTER"; do
            make compiler RELEASE="$release"
            make toolchain-check RELEASE="$release"
          done
          wfc_before="$PWD/build/whitefoot/$BEFORE/whitefootc"
          wfc_after="$PWD/build/whitefoot/$AFTER/whitefootc"
          sh research/experiments/halo-oracle/fetch-redis.sh "$PWD/build/redis" 7.0.15
          lua="$PWD/build/redis/redis-7.0.15/deps/lua/src/lua"
          # Same source on both sides; only the compiler differs.
          "$wfc_before" --graph research/experiments/halo-bench/modules.wfg --entry bench --full-lto -o "$out/halo-before"
          cp "$out/halo-before" "$out/halo-before-twin"
          "$wfc_after" --graph research/experiments/halo-bench/modules.wfg --entry bench --full-lto -o "$out/halo-after"
          {
            echo "source $(git rev-parse HEAD), before $BEFORE, after $AFTER"
            sha256sum "$wfc_before" "$wfc_after" "$out"/halo-*
            /usr/bin/clang --version | head -n 1
          } | tee "$out/manifest.txt"
          # The 14900K is a hybrid part (P-cores CPU 0-15, E-cores 16-31): run
          # every timed process on one ordinary P-core thread, CPU 2, and
          # record the topology and frequency policy.
          lscpu -e=CPU,CORE,MAXMHZ > "$out/lscpu.txt" 2>&1 || true
          cat /sys/devices/system/cpu/cpufreq/policy*/scaling_governor 2>/dev/null | sort | uniq -c > "$out/governor.txt" || true
          pin="taskset -c 2"
          echo "timed processes pinned with: $pin" | tee -a "$out/manifest.txt"
          cat "$out/governor.txt" | tee -a "$out/manifest.txt"
          # Cycles, instructions and blocked store forwards
          # (LD_BLOCKS.STORE_FORWARD, event 0x03 umask 0x82 on the P-cores),
          # three runs per side, on the two kernels whose profiles showed the
          # stalls. Three counters fit without multiplexing.
          for kernel in fib integer-table; do
            for side in before after; do
              for rep in 1 2 3; do
                $pin perf stat -x, -e cpu_core/cycles/,cpu_core/instructions/,cpu_core/event=0x03,umask=0x82,name=ld_blocks_store_forward/ \
                  -o "$out/perf-$kernel-$side-$rep.csv" "$out/halo-$side" \
                  < research/experiments/halo-bench/kernels/$kernel.lua > /dev/null 2>> "$out/perf-$kernel-$side-$rep.err"
                echo "== perf $kernel $side $rep"; grep -v '^#' "$out/perf-$kernel-$side-$rep.csv" | grep -v '^$'
              done
            done
          done
          kernels=fib,loop,integer-table,string-key,concat,sort,binary-trees
          compare() {
            label=$1; old=$2; new=$3
            for runs in 1 3 6; do
              $pin python3 -B research/experiments/halo-bench/run.py --lua "$lua" \
                --before-binary "$old" --binary "$new" --kernels "$kernels" \
                --scale binary-trees=14 --runs "$runs" --out "$out/$label-$runs.json" --compiler "$wfc_before" \
                > "$out/$label-$runs.log" 2>&1 || { cat "$out/$label-$runs.log"; exit 1; }
              echo "== $label, $runs pair(s)"
              grep 'ratio=' "$out/$label-$runs.log" | sed 's/ before=.*//'
            done
          }
          compare twin "$out/halo-before" "$out/halo-before-twin"
          compare upgrade "$out/halo-before" "$out/halo-after"
          TIMEFORMAT=%R
          for sample in 1 2 3; do
            for side in before after; do
              wfc="$wfc_before"; [ "$side" = after ] && wfc="$wfc_after"
              seconds=$( { time ($pin "$wfc" --graph lib/halo/modules.wfg --check-module pkg::vm > "$out/check-$side-$sample.log" 2>&1); } 2>&1 )
              echo "check-module pkg::vm $side sample $sample: $seconds s" | tee -a "$out/check-times.txt"
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: halo-bench-93e97ef
          path: build/bench-out/
          retention-days: 30

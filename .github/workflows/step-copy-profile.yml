# Temporary, on this branch only: removed before the branch is ready. Board
# item halo-beat-puc-work. It counts instructions per Lua call of fib for a
# Whitefoot compiler change: first Whitefoot#408 (wf-exp-1e2d6fa09265, run
# 38334973034: the Call arm's Step copy disappeared), now Whitefoot#405
# (release wf-93e97efdc27b, main 93e97efdc: frame slots that never cross a
# transfer between split-dispatch parts belong to each part). One Halo bench
# host, this branch's head (lib/ and the bench host equal bb2a10f), is built
# twice with full LTO on a hosted x86-64 runner: `base` by the compiler
# whitefoot.pin names and `head` by EXP_RELEASE. It reads instruction counts
# and code, never times. Expected for #405: no stores of the Result or the
# cursor at the Call and Return join, 14 fewer stores per Lua call.
name: step-copy-profile

on:
  push:
    branches: [claude/halo-beat-puc-fib]
    paths:
      - .github/workflows/step-copy-profile.yml

defaults:
  run:
    shell: bash

env:
  SLOW_LIB: bb2a10f
  EXP_RELEASE: wf-93e97efdc27b
  FIB_N: 32

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Install the host toolchain and valgrind
        run: |
          set -uo pipefail
          make toolchain
          sudo apt-get update -q
          sudo apt-get install -y -q valgrind binutils

      - name: Build Halo's bench host with the pinned and the experimental compiler
        run: |
          set -euo pipefail
          out="$PWD/build/step-copy-profile"
          rm -rf "$out"; mkdir -p "$out/disasm" "$out/callgrind"
          # The bench host is built from the checkout itself, whose Halo source
          # and bench host must equal bb2a10f's.
          if ! git diff --quiet "$SLOW_LIB" HEAD -- lib/ research/experiments/halo-bench/; then
            git diff --stat "$SLOW_LIB" HEAD -- lib/ research/experiments/halo-bench/
            echo "::error::lib/ or the bench host differs between $SLOW_LIB and HEAD"
            exit 1
          fi
          # The pinned release comes from whitefoot.pin. The experimental one
          # is fetched and verified by the same make target (downloaded from
          # the release, checked against its SHA256SUMS and manifest), with
          # RELEASE overridden on the command line; whitefoot.pin stays as it is.
          make compiler
          make toolchain-check
          make compiler RELEASE="$EXP_RELEASE"
          make toolchain-check RELEASE="$EXP_RELEASE"
          pinned_release=$(sed -n 's/^release = //p' whitefoot.pin)
          wfc_pinned="$PWD/build/whitefoot/$pinned_release/whitefootc"
          wfc_exp="$PWD/build/whitefoot/$EXP_RELEASE/whitefootc"
          test -x "$wfc_pinned" && test -x "$wfc_exp"
          test "$wfc_pinned" != "$wfc_exp"
          # Same source on both sides; only the compiler differs. base is the
          # pinned compiler, head the experimental one.
          SECONDS=0
          "$wfc_pinned" --graph research/experiments/halo-bench/modules.wfg --entry bench --full-lto -o "$out/halo-base"
          echo "base full-LTO build: ${SECONDS} s"
          SECONDS=0
          "$wfc_exp" --graph research/experiments/halo-bench/modules.wfg --entry bench --full-lto -o "$out/halo-head"
          echo "head full-LTO build: ${SECONDS} s"
          sed "s/^local N = 30\$/local N = $FIB_N/" research/experiments/halo-bench/kernels/fib.lua > "$out/fib.lua"
          grep -q "^local N = $FIB_N\$" "$out/fib.lua"
          {
            echo "source $(git rev-parse HEAD) (lib/ and bench host equal $(git rev-parse "$SLOW_LIB")), FIB_N $FIB_N"
            echo "base = pinned compiler $pinned_release, head = experimental compiler $EXP_RELEASE"
            sha256sum "$wfc_pinned" "$wfc_exp" "$out/halo-base" "$out/halo-head" "$out/fib.lua"
            cmp -s "$out/halo-base" "$out/halo-head" && echo "base and head binaries are identical" || echo "base and head binaries differ"
            file "$out/halo-base" "$out/halo-head"
            /usr/bin/clang --version | head -n 1
            uname -a
            valgrind --version || true
          } | tee "$out/manifest.txt"

      - name: Check both sides print fib
        run: |
          set -euo pipefail
          out="$PWD/build/step-copy-profile"
          expected=$(python3 -c "a,b=0,1
          for _ in range($FIB_N): a,b=b,a+b
          print(a)")
          for side in base head; do
            "$out/halo-$side" < "$out/fib.lua" > "$out/check-$side.out" 2> "$out/check-$side.err"
            echo "expected $expected; $side $(cat "$out/check-$side.out")"
            echo "$side stderr (suspensions, collections): $(tr '\n' ' ' < "$out/check-$side.err")"
            test "$(cat "$out/check-$side.out")" = "$expected"
          done

      - name: Count instructions with callgrind
        run: |
          set -uo pipefail
          out="$PWD/build/step-copy-profile"
          mkdir -p "$out/disasm" "$out/callgrind"
          cat > "$out/callgrind/annotate.py" <<'PY'
          # Joins callgrind's per-instruction counts (--dump-instr=yes) of one
          # executable with objdump of its hottest functions. Lives only in
          # this temporary workflow.
          import collections, os, re, subprocess, sys

          cg_out, exe, calls, top, outdir, prefix = sys.argv[1:7]
          extra = sys.argv[7:]
          calls, top = int(calls), int(top)
          exe_real = os.path.realpath(exe)
          tables = {'ob': {}, 'fl': {}, 'fn': {}}
          kinds = {'ob': 'ob', 'cob': 'ob', 'fl': 'fl', 'fi': 'fl', 'fe': 'fl', 'cfi': 'fl', 'cfl': 'fl', 'fn': 'fn', 'cfn': 'fn'}

          def name(kind, rest):
              m = re.match(r'\((\d+)\)\s*(.*)$', rest)
              if not m:
                  return rest
              if m.group(2):
                  tables[kind][m.group(1)] = m.group(2)
              return tables[kind].get(m.group(1), rest)

          cost, fn_cost, fn_min = collections.Counter(), collections.Counter(), {}
          npos, last, total = 1, [0, 0], None
          ob = fn = None
          after_calls = False
          with open(cg_out) as f:
              for raw in f:
                  line = raw.rstrip('\n')
                  if line.startswith('positions:'):
                      npos = len(line.split()) - 1
                      continue
                  if line.startswith(('summary:', 'totals:')):
                      total = int(line.split()[1])
                      continue
                  m = re.match(r'^(ob|cob|fl|fi|fe|cfi|cfl|fn|cfn)=(.*)$', line)
                  if m:
                      value = name(kinds[m.group(1)], m.group(2))
                      if m.group(1) == 'ob':
                          ob = os.path.realpath(value)
                      elif m.group(1) == 'fn':
                          fn = re.sub(r"'\d+$", '', value)
                      continue
                  if line.startswith('calls='):
                      after_calls = True
                      continue
                  if not line or '=' in line or ':' in line:
                      continue
                  parts = line.split()
                  if not re.match(r'^([+-]?(0x)?[0-9a-fA-F]+|\*)$', parts[0]):
                      continue
                  pos = []
                  for i, tok in enumerate(parts[:npos]):
                      if tok == '*':
                          pos.append(last[i])
                      elif tok[0] in '+-':
                          pos.append(last[i] + int(tok, 0))
                      else:
                          pos.append(int(tok, 0))
                  last[:len(pos)] = pos
                  if after_calls:
                      after_calls = False
                      continue
                  ir = int(parts[npos]) if len(parts) > npos else 0
                  if ob != exe_real or fn is None:
                      continue
                  addr = pos[0]
                  cost[addr] += ir
                  fn_cost[fn] += ir
                  fn_min[fn] = min(fn_min.get(fn, addr), addr)

          nm = {}
          for row in subprocess.run(['nm', '--defined-only', exe], capture_output=True, text=True).stdout.splitlines():
              bits = row.split(None, 2)
              if len(bits) == 3 and bits[1] in 'tTwW':
                  nm.setdefault(bits[2], int(bits[0], 16))
          biases = collections.Counter(fn_min[f] - nm[f] for f in fn_min if f in nm)
          bias = biases.most_common(1)[0][0] if biases else 0
          exe_total = sum(fn_cost.values())
          lines = [f'executable {exe}', f'program Ir (callgrind summary) {total}', f'executable Ir {exe_total}',
                   f'Lua calls of fib {calls}', f'executable Ir per Lua call {exe_total / calls:.2f}',
                   f'load bias {bias:#x} (agreeing functions {biases.most_common(1)[0][1] if biases else 0} of {len(fn_min)})', '',
                   f'{"Ir":>14} {"share":>7} {"per call":>9}  function']
          hot = [f for f, _ in fn_cost.most_common()]
          for f in hot[:40]:
              lines.append(f'{fn_cost[f]:>14} {100 * fn_cost[f] / exe_total:6.2f}% {fn_cost[f] / calls:9.2f}  {f}')
          with open(os.path.join(outdir, f'{prefix}-functions.txt'), 'w') as w:
              w.write('\n'.join(lines) + '\n')
          print('\n'.join(lines[:30]))
          wanted = hot[:top] + [s for s in nm if any(re.search(e, s) for e in extra) and s not in hot[:top]]
          for f in wanted:
              dis = subprocess.run(['objdump', '-d', '--no-show-raw-insn', '-M', 'intel', f'--disassemble={f}', exe],
                                   capture_output=True, text=True).stdout
              rows = [f'# {f}: {fn_cost.get(f, 0)} Ir, {fn_cost.get(f, 0) / calls:.2f} per Lua call',
                      '# columns: times executed, executions per Lua call, address, instruction']
              for row in dis.splitlines():
                  m = re.match(r'^\s*([0-9a-f]+):\s*(.*)$', row)
                  if m:
                      n = cost.get(int(m.group(1), 16) + bias, 0)
                      rows.append(f'{n:>12} {n / calls:8.3f}  {m.group(1)}: {m.group(2)}')
                  elif row.strip() and not row.startswith(exe):
                      rows.append(row)
              safe = re.sub(r'[^A-Za-z0-9_.-]', '_', f)[:150]
              with open(os.path.join(outdir, f'{prefix}-ir-{safe}.txt'), 'w') as w:
                  w.write('\n'.join(rows) + '\n')
              print(f'{prefix}: {f} {len(rows) - 2} lines')
          PY
          calls=$(python3 -c "a,b=0,1
          for _ in range($FIB_N + 1): a,b=b,a+b
          print(2 * a - 1)")
          echo "fib($FIB_N) makes $calls Lua calls of fib" | tee -a "$out/manifest.txt"
          for side in base head; do
            SECONDS=0
            valgrind --tool=callgrind --dump-instr=yes --dump-line=no --compress-strings=no --compress-pos=no \
              --callgrind-out-file="$out/callgrind/$side.out" "$out/halo-$side" < "$out/fib.lua" \
              > "$out/callgrind/$side.stdout" 2> "$out/callgrind/$side.stderr"
            echo "== callgrind $side: exit $?, ${SECONDS} s, printed $(cat "$out/callgrind/$side.stdout")"
            tail -n 5 "$out/callgrind/$side.stderr"
            callgrind_annotate --inclusive=no "$out/callgrind/$side.out" > "$out/callgrind/$side-annotate.txt" 2>&1 || true
            echo "== annotate $side"
            python3 -I "$out/callgrind/annotate.py" "$out/callgrind/$side.out" "$out/halo-$side" "$calls" 12 "$out/callgrind" "$side" \
              'enter_lua$' '\.finish$' '\.prepare' 'charge_coroutine_call' 'lua_callee' 'push_frame$' 'ensure_stack' 'native_binding' 'instruction_call' 'instruction_tail_call' '(^|[.:_])run$' \
              || echo "$side annotation failed"
          done

      - name: Compare executable instructions per Lua call
        run: |
          set -uo pipefail
          out="$PWD/build/step-copy-profile"
          {
            for side in base head; do
              echo "== $side"
              sed -n '1,6p' "$out/callgrind/$side-functions.txt"
              echo "top functions"
              sed -n '8,26p' "$out/callgrind/$side-functions.txt"
              echo
            done
            echo "== executable Ir per Lua call"
            for side in base head; do
              echo "$side: $(sed -n 's/^executable Ir per Lua call //p' "$out/callgrind/$side-functions.txt")"
            done
          } | tee "$out/callgrind/compare.txt"

      - name: Disassemble the dispatch function and measure its frame
        run: |
          set -uo pipefail
          out="$PWD/build/step-copy-profile"
          mkdir -p "$out/disasm"
          # Stack frame size and pushes in the first 40 instructions of one
          # objdump listing of one function.
          prologue() {
            awk '
              /^ *[0-9a-f]+:/ {
                n++
                if (n > 40) exit
                ins = $0
                sub(/^ *[0-9a-f]+:[ \t]*/, "", ins)
                if (ins ~ /^push/) { pushes++; regs = regs " " $NF }
                if (ins ~ /^sub +rsp,/ && frame == "") frame = ins
              }
              END { printf "pushes=%d (%s ) frame: %s\n", pushes, regs, (frame == "" ? "no sub rsp in the first 40 instructions" : frame) }
            ' "$1"
          }
          for side in base head; do
            exe="$out/halo-$side"
            nm "$exe" > "$out/$side-symbols.txt"
            # Every symbol that contains "run", then the ones that may be the
            # dispatch function: "run" as a whole word (or after _ . :) or
            # "dispatch" in the name. Disassemble each of the latter.
            nm --defined-only "$exe" | awk '$2 ~ /^[tTwW]$/ { print $3 }' | grep 'run' | sort -u > "$out/$side-run-any.txt"
            grep -E '(^|[^A-Za-z0-9])run($|[^A-Za-z0-9])|dispatch' "$out/$side-run-any.txt" | sort -u > "$out/$side-run-candidates.txt" || true
            echo "== $side: $(wc -l < "$out/$side-run-any.txt") symbols contain run, $(wc -l < "$out/$side-run-candidates.txt") candidates"
            cat "$out/$side-run-candidates.txt"
            : > "$out/$side-run-prologues.txt"
            while read -r sym; do
              [ -n "$sym" ] || continue
              safe=$(printf '%s' "$sym" | tr -c 'A-Za-z0-9_.\n-' '_' | cut -c1-150)
              f="$out/disasm/$side-$safe.txt"
              objdump -d --no-show-raw-insn -M intel --disassemble="$sym" "$exe" > "$f" 2> /dev/null || true
              ins=$(grep -c -E '^ +[0-9a-f]+:' "$f")
              rsp=$(grep -c -E '\[rsp' "$f")
              echo "$side $sym: $ins instructions, $rsp with a [rsp...] operand; $(prologue "$f")" | tee -a "$out/$side-run-prologues.txt"
            done < "$out/$side-run-candidates.txt"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: halo-step-copy-profile
          path: |
            build/step-copy-profile/
            !build/step-copy-profile/*.data
          if-no-files-found: ignore
          retention-days: 30

# Temporary: in-place table growth with a reallocating grow on the 14900K
# (research/experiments/halo-bench/RESULTS.md, "Growing the array in place
# with a reallocating grow"). The hosted job checks that the branch builds
# with both releases; the 14900K job runs only for a commit whose message
# contains [bench], pushed once the runner is confirmed idle. Removed before
# the pull request is marked ready. Run on the 14900K: 2026-10-08.
name: bench-realloc

on:
  push:
    branches: [claude/halo-grow-realloc]
    paths: [.github/workflows/bench-realloc.yml, research/experiments/halo-bench/RESULTS.md]

env:
  EXPERIMENT: wf-exp-4f6a0c240d2c
  BASE_SOURCE: 0def882485501a70ec9e1ff5e9129abc85bd215c

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build the branch with the pin and with the experiment
        run: |
          set -euo pipefail
          make toolchain
          pinned=$(sed -n 's/^release = //p' whitefoot.pin)
          cp whitefoot.pin whitefoot.pin.orig
          for release in "$pinned" "$EXPERIMENT"; do
            echo "release = $release" > whitefoot.pin
            make compiler
            make toolchain-check
            build/whitefoot/$release/whitefootc --graph research/experiments/halo-bench/modules.wfg --entry bench --full-lto -o "build/halo-$release"
            echo "built with $release"
          done

  bench:
    needs: build
    if: contains(github.event.head_commit.message, '[bench]')
    runs-on: [self-hosted, 14900k]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Build three binaries and compare
        run: |
          set -euo pipefail
          out="$PWD/build/bench-out"
          rm -rf "$out" build/base-src
          mkdir -p "$out" build/base-src
          pinned=$(sed -n 's/^release = //p' whitefoot.pin)
          cp whitefoot.pin "$out/whitefoot.pin.orig"
          for release in "$pinned" "$EXPERIMENT"; do
            echo "release = $release" > whitefoot.pin
            make compiler
            make toolchain-check
          done
          cp "$out/whitefoot.pin.orig" whitefoot.pin
          wfc="$PWD/build/whitefoot/$pinned/whitefootc"
          wfc_exp="$PWD/build/whitefoot/$EXPERIMENT/whitefootc"
          sh research/experiments/halo-oracle/fetch-redis.sh "$PWD/build/redis"
          lua="$PWD/build/redis/redis-7.0.15/deps/lua/src/lua"
          git archive "$BASE_SOURCE" | tar -x -C build/base-src
          git diff --stat "$BASE_SOURCE" HEAD -- lib research/experiments/halo-bench/host research/experiments/halo-bench/modules.wfg | tee "$out/source-diff.txt"
          (cd build/base-src && "$wfc" --graph research/experiments/halo-bench/modules.wfg --entry bench --full-lto -o "$out/halo-base")
          cp "$out/halo-base" "$out/halo-base-twin"
          "$wfc" --graph research/experiments/halo-bench/modules.wfg --entry bench --full-lto -o "$out/halo-head-pin"
          "$wfc_exp" --graph research/experiments/halo-bench/modules.wfg --entry bench --full-lto -o "$out/halo-head-exp"
          {
            echo "branch $(git rev-parse HEAD), base source $BASE_SOURCE, pinned $pinned, experiment $EXPERIMENT"
            sha256sum "$wfc" "$wfc_exp" "$out"/halo-*
            /usr/bin/clang --version | head -n 1
            echo "realloc calls: pin $(objdump -d "$out/halo-head-pin" | grep -c '<realloc@plt>'), exp $(objdump -d "$out/halo-head-exp" | grep -c '<realloc@plt>')"
          } | tee "$out/manifest.txt"
          kernels=fib,loop,integer-table,string-key,concat,sort,binary-trees
          compare() {
            label=$1; before=$2; after=$3
            for runs in 1 3 6; do
              python3 -B research/experiments/halo-bench/run.py --lua "$lua" \
                --before-binary "$before" --binary "$after" --kernels "$kernels" \
                --scale binary-trees=14 --runs "$runs" --out "$out/$label-$runs.json" --compiler "$wfc" \
                > "$out/$label-$runs.log" 2>&1 || { cat "$out/$label-$runs.log"; exit 1; }
              echo "== $label, $runs pair(s)"
              grep 'ratio=' "$out/$label-$runs.log" | sed 's/ before=.*//'
            done
          }
          compare twin "$out/halo-base" "$out/halo-base-twin"
          compare shipped "$out/halo-base" "$out/halo-head-exp"
          compare compiler "$out/halo-head-pin" "$out/halo-head-exp"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: halo-bench-realloc
          path: build/bench-out/
          retention-days: 30

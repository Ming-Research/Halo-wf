# Temporary study controls; remove before the coroutine branch is ready.
name: coroutine thread controls

on:
  push:
    branches: [claude/halo-coroutines]
  workflow_dispatch:
    inputs:
      edges:
        description: Comma-separated edges or all; inspect the stack sample before selecting a larger batch
        required: true
        default: stack

concurrency:
  group: coroutine-thread-controls-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install the pinned compiler and host toolchain
        run: make toolchain
      - name: Compile the baseline and selected missing-edge controls
        env:
          THREAD_ROOT_MUTANTS: ${{ inputs.edges || 'stack' }}
        run: |
          release=$(sed -n 's/^release = //p' whitefoot.pin)
          export WHITEFOOTC="$GITHUB_WORKSPACE/build/whitefoot/$release/whitefootc"
          sh research/experiments/halo-gc/thread-controls.sh build/thread-controls
      - name: Keep control diagnostics and native outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coroutine-thread-controls
          path: build/thread-controls/*.log
          if-no-files-found: warn
          retention-days: 14

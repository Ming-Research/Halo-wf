# Temporary study controls; remove before the coroutine branch is ready.
name: coroutine thread controls

on:
  push:
    branches: [claude/halo-coroutines]
  workflow_dispatch:
    inputs:
      edges:
        description: Comma-separated edges or all; inspect stack build and oracle timings before selecting a larger batch
        required: true
        default: stack

concurrency:
  group: coroutine-thread-controls-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install the pinned compiler and host toolchain
        run: make toolchain
      - name: Compare selected missing-edge mutants with coroutine recordings and isolated probes
        env:
          THREAD_ROOT_MUTANTS: ${{ inputs.edges || 'stack' }}
        run: |
          release=$(sed -n 's/^release = //p' whitefoot.pin)
          export WHITEFOOTC="$GITHUB_WORKSPACE/build/whitefoot/$release/whitefootc"
          sh research/experiments/halo-gc/thread-controls.sh build/thread-controls
      - name: Keep timings, omissions, oracle replies and control diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coroutine-thread-controls
          path: |
            build/thread-controls/*.log
            build/thread-controls/*.md
            build/thread-controls/*.tsv
            build/thread-controls/*.diff
            build/thread-controls/actual-*
          if-no-files-found: warn
          retention-days: 14

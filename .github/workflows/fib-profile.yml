# Temporary: removed before the branch is ready. Step 1 of the board item for
# Halo beating PUC (halo-beat-puc-work): where Halo spends fib's time against
# PUC Lua 5.1.5, on a hosted x86-64 runner. It reads shares of samples and
# instruction counts, never times: the hosted guest gives direction only.
#
# Builds Halo's bench host with full LTO exactly as halo-bench's README and
# run.py build it, and Redis 7.0.15's bundled PUC Lua 5.1.5 with
# fetch-redis.sh. Both read the fib kernel from stdin at N = $FIB_N. Then:
# - perf record -g, three launches per engine (task-clock when the guest has
#   no hardware counters), reported by symbol without children; perf annotate
#   of Halo's three hottest symbols and PUC's;
# - callgrind with per-instruction counts, one launch per engine: exact
#   instructions executed per function and per instruction, each divided by
#   the number of Lua calls fib makes, joined with objdump of the hot
#   functions (callgrind is the fallback when perf cannot be installed);
# - objdump -d of Halo's hot functions and call path, and PUC's interpreter
#   loop, precall and poscall; luac -l of the kernel.
name: fib-profile

on:
  push:
    branches: [claude/halo-beat-puc-fib]
    paths:
      - .github/workflows/fib-profile.yml
      - research/experiments/halo-bench/**
      - lib/halo/**

defaults:
  run:
    shell: bash

env:
  FIB_N: 32

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Install the host toolchain, perf and valgrind
        run: |
          set -uo pipefail
          make toolchain
          sudo apt-get update -q
          sudo apt-get install -y -q valgrind binutils
          sudo apt-get install -y -q "linux-tools-$(uname -r)" linux-tools-common \
            || sudo apt-get install -y -q linux-tools-generic linux-tools-common \
            || echo "no linux-tools package installed"
          sudo sysctl -w kernel.perf_event_paranoid=-1 || true
          sudo sysctl -w kernel.kptr_restrict=0 || true

      - name: Build Halo's bench host and PUC Lua 5.1.5
        run: |
          set -euo pipefail
          out="$PWD/build/fib-profile"
          rm -rf "$out"; mkdir -p "$out"
          release=$(sed -n 's/^release = //p' whitefoot.pin)
          make compiler
          make toolchain-check
          wfc="$PWD/build/whitefoot/$release/whitefootc"
          SECONDS=0
          "$wfc" --graph research/experiments/halo-bench/modules.wfg --entry bench --full-lto -o "$out/halo"
          echo "full-LTO build: ${SECONDS} s"
          sh research/experiments/halo-oracle/fetch-redis.sh "$PWD/build/redis"
          cp build/redis/redis-7.0.15/deps/lua/src/lua "$out/lua"
          cp build/redis/lua-build.log "$out/lua-build.log"
          sed "s/^local N = 30\$/local N = $FIB_N/" research/experiments/halo-bench/kernels/fib.lua > "$out/fib.lua"
          grep -q "^local N = $FIB_N\$" "$out/fib.lua"
          build/redis/redis-7.0.15/deps/lua/src/luac -l -p "$out/fib.lua" > "$out/luac-fib.txt" 2>&1 || true
          {
            echo "branch $(git rev-parse HEAD), release $release, FIB_N $FIB_N"
            sha256sum "$wfc" "$out/halo" "$out/lua" "$out/fib.lua"
            file "$out/halo" "$out/lua"
            /usr/bin/clang --version | head -n 1
            echo "puc-5.1.5 compile: $(grep -m1 -e ' -c .*lvm\.c' build/redis/lua-build.log || echo 'no lvm.c line')"
            uname -a
            lscpu | grep -E 'Model name|^CPU\(s\)|MHz|Hypervisor|Flags' || true
            valgrind --version || true
          } | tee "$out/manifest.txt"

      - name: Check both engines print the same fib
        run: |
          set -euo pipefail
          out="$PWD/build/fib-profile"
          expected=$(python3 -c "a,b=0,1
          for _ in range($FIB_N): a,b=b,a+b
          print(a)")
          "$out/halo" < "$out/fib.lua" > "$out/check-halo.out" 2> "$out/check-halo.err"
          "$out/lua" - < "$out/fib.lua" > "$out/check-puc.out"
          echo "expected $expected; halo $(cat "$out/check-halo.out"); puc $(cat "$out/check-puc.out")"
          echo "halo stderr (suspensions, collections): $(tr '\n' ' ' < "$out/check-halo.err")"
          test "$(cat "$out/check-halo.out")" = "$expected"
          test "$(cat "$out/check-puc.out")" = "$expected"

      - name: Sample with perf
        run: |
          set -uo pipefail
          out="$PWD/build/fib-profile"
          perf=perf
          if ! perf --version > /dev/null 2>&1; then
            perf=$(ls /usr/lib/linux-tools/*/perf 2> /dev/null | tail -n 1)
          fi
          if [ -z "$perf" ] || ! "$perf" --version > /dev/null 2>&1; then
            echo "perf is unavailable on this runner; the callgrind step stands alone" | tee "$out/perf-unavailable.txt"
            exit 0
          fi
          event=cycles
          "$perf" record -q -e cycles -o "$out/probe.data" true 2> "$out/probe.err" || event=cpu-clock
          {
            "$perf" --version
            echo "perf_event_paranoid: $(cat /proc/sys/kernel/perf_event_paranoid)"
            echo "requested event: $event"
          } | tee -a "$out/manifest.txt"
          for i in 1 2 3; do
            for side in halo puc; do
              if [ "$side" = halo ]; then cmd=("$out/halo"); else cmd=("$out/lua" -); fi
              "$perf" record -q -g -e "$event" -o "$out/$side-$i.data" "${cmd[@]}" < "$out/fib.lua" > "$out/$side-$i.out" 2> "$out/$side-$i.err"
              echo "== $side launch $i: exit $?, printed $(cat "$out/$side-$i.out")"
              "$perf" report -q -i "$out/$side-$i.data" --no-children -g none --sort symbol --percent-limit 0.3 --stdio 2> /dev/null > "$out/report-$side-$i.txt"
              head -n 20 "$out/report-$side-$i.txt"
            done
          done
          "$perf" evlist -v -i "$out/halo-1.data" > "$out/recorded-event.txt" 2>&1 || true
          for side in halo puc; do
            "$perf" report -i "$out/$side-1.data" --no-children --sort symbol --percent-limit 2 --stdio 2> /dev/null > "$out/callers-$side-1.txt" || true
            grep -E '^ +[0-9.]+%' "$out/report-$side-1.txt" | awk '{print $3}' | head -n 3 > "$out/top3-$side.txt"
            n=0
            while read -r sym; do
              n=$((n + 1))
              "$perf" annotate -i "$out/$side-1.data" --stdio --no-source -s "$sym" > "$out/annotate-$side-$n.txt" 2>&1 || true
              echo "annotate $side $n: $sym, $(wc -l < "$out/annotate-$side-$n.txt") lines"
            done < "$out/top3-$side.txt"
          done
          grep -E '^ +[0-9.]+%' "$out/report-halo-1.txt" | awk '{print $3}' | head -n 10 > "$out/top10-halo.txt"
          mkdir -p "$out/disasm"
          while read -r sym; do
            f="$out/disasm/halo-$(echo "$sym" | tr -c 'A-Za-z0-9_.\n-' '_' | cut -c1-150).txt"
            objdump -d --no-show-raw-insn -M intel --disassemble="$sym" "$out/halo" > "$f" 2> /dev/null || true
            echo "$sym $(grep -c -E '^ +[0-9a-f]+:' "$f") instructions"
          done < "$out/top10-halo.txt" | tee "$out/halo-hot-sizes.txt"

      - name: Count instructions with callgrind
        run: |
          set -uo pipefail
          out="$PWD/build/fib-profile"
          mkdir -p "$out/disasm" "$out/callgrind"
          cat > "$out/callgrind/annotate.py" <<'PY'
          # Joins callgrind's per-instruction counts (--dump-instr=yes) of one
          # executable with objdump of its hottest functions. Lives only in
          # this temporary workflow.
          import collections, os, re, subprocess, sys

          cg_out, exe, calls, top, outdir, prefix = sys.argv[1:7]
          extra = sys.argv[7:]
          calls, top = int(calls), int(top)
          exe_real = os.path.realpath(exe)
          tables = {'ob': {}, 'fl': {}, 'fn': {}}
          kinds = {'ob': 'ob', 'cob': 'ob', 'fl': 'fl', 'fi': 'fl', 'fe': 'fl', 'cfi': 'fl', 'cfl': 'fl', 'fn': 'fn', 'cfn': 'fn'}

          def name(kind, rest):
              m = re.match(r'\((\d+)\)\s*(.*)$', rest)
              if not m:
                  return rest
              if m.group(2):
                  tables[kind][m.group(1)] = m.group(2)
              return tables[kind].get(m.group(1), rest)

          cost, fn_cost, fn_min = collections.Counter(), collections.Counter(), {}
          npos, last, total = 1, [0, 0], None
          ob = fn = None
          after_calls = False
          with open(cg_out) as f:
              for raw in f:
                  line = raw.rstrip('\n')
                  if line.startswith('positions:'):
                      npos = len(line.split()) - 1
                      continue
                  if line.startswith(('summary:', 'totals:')):
                      total = int(line.split()[1])
                      continue
                  m = re.match(r'^(ob|cob|fl|fi|fe|cfi|cfl|fn|cfn)=(.*)$', line)
                  if m:
                      value = name(kinds[m.group(1)], m.group(2))
                      if m.group(1) == 'ob':
                          ob = os.path.realpath(value)
                      elif m.group(1) == 'fn':
                          fn = re.sub(r"'\d+$", '', value)
                      continue
                  if line.startswith('calls='):
                      after_calls = True
                      continue
                  if not line or '=' in line or ':' in line:
                      continue
                  parts = line.split()
                  if not re.match(r'^([+-]?(0x)?[0-9a-fA-F]+|\*)$', parts[0]):
                      continue
                  pos = []
                  for i, tok in enumerate(parts[:npos]):
                      if tok == '*':
                          pos.append(last[i])
                      elif tok[0] in '+-':
                          pos.append(last[i] + int(tok, 0))
                      else:
                          pos.append(int(tok, 0))
                  last[:len(pos)] = pos
                  if after_calls:
                      after_calls = False
                      continue
                  ir = int(parts[npos]) if len(parts) > npos else 0
                  if ob != exe_real or fn is None:
                      continue
                  addr = pos[0]
                  cost[addr] += ir
                  fn_cost[fn] += ir
                  fn_min[fn] = min(fn_min.get(fn, addr), addr)

          nm = {}
          for row in subprocess.run(['nm', '--defined-only', exe], capture_output=True, text=True).stdout.splitlines():
              bits = row.split(None, 2)
              if len(bits) == 3 and bits[1] in 'tTwW':
                  nm.setdefault(bits[2], int(bits[0], 16))
          biases = collections.Counter(fn_min[f] - nm[f] for f in fn_min if f in nm)
          bias = biases.most_common(1)[0][0] if biases else 0
          exe_total = sum(fn_cost.values())
          lines = [f'executable {exe}', f'program Ir (callgrind summary) {total}', f'executable Ir {exe_total}',
                   f'Lua calls of fib {calls}', f'executable Ir per Lua call {exe_total / calls:.2f}',
                   f'load bias {bias:#x} (agreeing functions {biases.most_common(1)[0][1] if biases else 0} of {len(fn_min)})', '',
                   f'{"Ir":>14} {"share":>7} {"per call":>9}  function']
          hot = [f for f, _ in fn_cost.most_common()]
          for f in hot[:40]:
              lines.append(f'{fn_cost[f]:>14} {100 * fn_cost[f] / exe_total:6.2f}% {fn_cost[f] / calls:9.2f}  {f}')
          with open(os.path.join(outdir, f'{prefix}-functions.txt'), 'w') as w:
              w.write('\n'.join(lines) + '\n')
          print('\n'.join(lines[:30]))
          wanted = hot[:top] + [s for s in nm if any(re.search(e, s) for e in extra) and s not in hot[:top]]
          for f in wanted:
              dis = subprocess.run(['objdump', '-d', '--no-show-raw-insn', '-M', 'intel', f'--disassemble={f}', exe],
                                   capture_output=True, text=True).stdout
              rows = [f'# {f}: {fn_cost.get(f, 0)} Ir, {fn_cost.get(f, 0) / calls:.2f} per Lua call',
                      '# columns: times executed, executions per Lua call, address, instruction']
              for row in dis.splitlines():
                  m = re.match(r'^\s*([0-9a-f]+):\s*(.*)$', row)
                  if m:
                      n = cost.get(int(m.group(1), 16) + bias, 0)
                      rows.append(f'{n:>12} {n / calls:8.3f}  {m.group(1)}: {m.group(2)}')
                  elif row.strip() and not row.startswith(exe):
                      rows.append(row)
              safe = re.sub(r'[^A-Za-z0-9_.-]', '_', f)[:150]
              with open(os.path.join(outdir, f'{prefix}-ir-{safe}.txt'), 'w') as w:
                  w.write('\n'.join(rows) + '\n')
              print(f'{prefix}: {f} {len(rows) - 2} lines')
          PY
          calls=$(python3 -c "a,b=0,1
          for _ in range($FIB_N + 1): a,b=b,a+b
          print(2 * a - 1)")
          echo "fib($FIB_N) makes $calls Lua calls of fib" | tee -a "$out/manifest.txt"
          for side in halo puc; do
            if [ "$side" = halo ]; then cmd=("$out/halo"); else cmd=("$out/lua" -); fi
            SECONDS=0
            valgrind --tool=callgrind --dump-instr=yes --dump-line=no --compress-strings=no --compress-pos=no \
              --callgrind-out-file="$out/callgrind/$side.out" "${cmd[@]}" < "$out/fib.lua" \
              > "$out/callgrind/$side.stdout" 2> "$out/callgrind/$side.stderr"
            echo "== callgrind $side: exit $?, ${SECONDS} s, printed $(cat "$out/callgrind/$side.stdout")"
            tail -n 5 "$out/callgrind/$side.stderr"
            callgrind_annotate --inclusive=no "$out/callgrind/$side.out" > "$out/callgrind/$side-annotate.txt" 2>&1 || true
          done
          python3 -I "$out/callgrind/annotate.py" "$out/callgrind/halo.out" "$out/halo" "$calls" 12 "$out/callgrind" halo \
            'enter_lua$' 'push_frame$' '\.prepare' '\.finish$' 'close_upvalues' 'ensure_stack' 'native_binding' 'lua_callee' 'pop_frame' || echo "halo annotation failed"
          python3 -I "$out/callgrind/annotate.py" "$out/callgrind/puc.out" "$out/lua" "$calls" 6 "$out/callgrind" puc \
            '^luaV_execute$' '^luaD_precall$' '^luaD_poscall$' '^luaF_close$' '^luaV_lessthan$' || echo "puc annotation failed"
          nm "$out/halo" > "$out/halo-symbols.txt"
          for sym in luaV_execute luaD_precall luaD_poscall luaF_close luaV_lessthan; do
            objdump -d --no-show-raw-insn -M intel --disassemble="$sym" "$out/lua" > "$out/disasm/puc-$sym.txt" 2> /dev/null || true
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: halo-fib-profile
          path: |
            build/fib-profile/
            !build/fib-profile/*.data
          if-no-files-found: ignore
          retention-days: 30

# Temporary, for the Halo performance line (Q94): emits the LLVM IR of
# push_frame with the experiment compiler that reads by-value parameters in
# place, to find which of that rule's conditions push_frame fails
# (research/experiments/halo-bench/RESULTS.md, "The entry copy of a by-value
# parameter, measured"). A push of this file runs it. Removed before the
# pull request is marked ready.
name: ir-inplace

on:
  push:
    branches: [claude/halo-call]
    paths: [.github/workflows/ir-inplace.yml]

env:
  EXPERIMENT: wf-exp-5a3c70fc3351

defaults:
  run:
    shell: bash

jobs:
  ir:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Install the host toolchain
        run: make toolchain

      - name: Emit push_frame's IR with both compilers
        run: |
          set -euo pipefail
          out="$PWD/build/ir-out"
          rm -rf "$out"; mkdir -p "$out"
          pinned=$(sed -n 's/^release = //p' whitefoot.pin)
          make compiler
          echo "release = $EXPERIMENT" > "$out/exp.pin"
          make PIN="$out/exp.pin" compiler
          for side in pin exp; do
            release=$pinned; [ "$side" = exp ] && release=$EXPERIMENT
            wfc="$PWD/build/whitefoot/$release/whitefootc"
            "$wfc" --graph research/experiments/halo-bench/modules.wfg --entry bench --emit-llvm -o "$out/bench-$side.ll"
            awk '/^define .*@"?wf_package\.halo\.vm\.push_frame"?[(.]/{f=1} f{print} f&&/^}/{exit}' "$out/bench-$side.ll" > "$out/push_frame-$side.ll"
            echo "== push_frame, $side: $(wc -l < "$out/push_frame-$side.ll") lines"
            cat "$out/push_frame-$side.ll"
          done
          grep -n 'call void @wf_package.halo.vm.push_frame\|call .*@wf_package.halo.vm.push_frame' "$out/bench-exp.ll" | head -5 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: halo-inplace-ir
          path: build/ir-out/
          retention-days: 30

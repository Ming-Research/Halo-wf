# Temporary, for the Halo performance line (Q94): emits the LLVM IR of
# push_frame with the experiment compiler that reads by-value parameters in
# place, to find which of that rule's conditions push_frame fails
# (research/experiments/halo-bench/RESULTS.md, "The entry copy of a by-value
# parameter, measured"). A push of this file runs it. Removed before the
# pull request is marked ready.
name: ir-inplace

on:
  push:
    branches: [claude/halo-call]
    paths: [.github/workflows/ir-inplace.yml]


env:
  EXPERIMENT: wf-exp-5a3c70fc3351

defaults:
  run:
    shell: bash

jobs:
  ir:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Install the host toolchain
        run: make toolchain

      - name: Emit push_frame's IR with both compilers
        run: |
          set -euo pipefail
          out="$PWD/build/ir-out"
          rm -rf "$out"; mkdir -p "$out"
          pinned=$(sed -n 's/^release = //p' whitefoot.pin)
          make compiler
          echo "release = $EXPERIMENT" > "$out/exp.pin"
          make PIN="$out/exp.pin" compiler
          for side in pin exp; do
            release=$pinned; [ "$side" = exp ] && release=$EXPERIMENT
            wfc="$PWD/build/whitefoot/$release/whitefootc"
            "$wfc" --graph research/experiments/halo-bench/modules.wfg --entry bench --emit-llvm -o "$out/bench-$side.ll"
            awk '/^define .*@"?wf_package\.halo\.vm\.push_frame"?[(.]/{f=1} f{print} f&&/^}/{exit}' "$out/bench-$side.ll" > "$out/push_frame-$side.ll"
            echo "== push_frame, $side: $(wc -l < "$out/push_frame-$side.ll") lines"
            cat "$out/push_frame-$side.ll"
          done
          grep -n 'call void @wf_package.halo.vm.push_frame\|call .*@wf_package.halo.vm.push_frame' "$out/bench-exp.ll" | head -5 || true
          cat > "$out/witness.wf" <<'WF'
          alias ExitStatus = std::process::ExitStatus;
          alias exit_status = std::process::exit_status;

          struct Rec {
            a: u64;
            b: u64;
            c: u64;
            d: u64;
            e: u64;
            f: u64;
            g: u64;
            h: u64;
            i: u64;
            j: u64;
          }

          fn rec_first(r: Rec) -> s: u64 pure {
            return r.a;
          }

          fn rec_forward(r: Rec) -> s: u64 pure {
            return rec_first(r: r);
          }

          fn rec_push(v: &Box<Slots<Rec>>, r: Rec) -> ok: Bool writes(v) {
            if v^.inner.len < v^.inner.cap {
              place_back(window: &v^.inner, value: r);
              return True();
            }
            return False();
          }

          fn rec_push_via(v: &Box<Slots<Rec>>, r: Rec) -> ok: Bool writes(v) {
            return rec_push(v: v, r: r);
          }

          fn rec_set(v: &Box<Slots<Rec>>, r: Rec) -> ok: Bool writes(v) {
            if 0_u64 < v^.inner.len {
              set v^.inner[0_u64] = r;
              return True();
            }
            return False();
          }

          fn rec_pick(r: Rec, c: Bool) -> s: u64 pure {
            if c {
              return r.a;
            }
            return r.b;
          }

          fn main() -> status: ExitStatus pure {
            let v = box_slots_new::<Rec>(capacity: 4_u64);
            let r = Rec(a: 1_u64, b: 2_u64, c: 3_u64, d: 4_u64, e: 5_u64, f: 6_u64, g: 7_u64, h: 8_u64, i: 9_u64, j: 10_u64);
            let first = rec_first(r: r);
            let forwarded = rec_forward(r: r);
            let pushed = rec_push(v: &v, r: r);
            let via = rec_push_via(v: &v, r: r);
            let stored = rec_set(v: &v, r: r);
            let picked = rec_pick(r: r, c: via);
            if pushed {
              if stored {
                if first == forwarded {
                  if picked == 1_u64 {
                    return exit_status(code: 0_u8);
                  }
                }
              }
            }
            return exit_status(code: 1_u8);
          }
          WF
          for side in pin exp; do
            release=$pinned; [ "$side" = exp ] && release=$EXPERIMENT
            wfc="$PWD/build/whitefoot/$release/whitefootc"
            "$wfc" "$out/witness.wf" --emit-llvm -o "$out/witness-$side.ll"
            for fn in rec_first rec_forward rec_push rec_push_via rec_set rec_pick; do
              awk -v name="$fn" '$0 ~ "^define .*@[^ ]*" name "[(.]" {f=1} f{print} f&&/^}/{exit}' "$out/witness-$side.ll" > "$out/witness-$side-$fn.ll"
              echo "== witness $side $fn: $(grep -c 'llvm.memmove\|llvm.memcpy' "$out/witness-$side-$fn.ll") entry copies"
              head -n 8 "$out/witness-$side-$fn.ll"
            done
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: halo-inplace-ir
          path: build/ir-out/
          retention-days: 30

# Temporary, on this branch only: removed before the branch is ready. Board
# item halo-beat-puc-own. Falsifier written in
# research/experiments/halo-bench/RESULTS.md, "Metamethod names interned once
# and the known raw miss passed to the slow path": callgrind instruction counts (Ir) of Halo's bench
# host on the are-we-fast-yet programs List and Towers, at BASE (main
# 8ee6634) and at this branch's head, both built by the pinned compiler with
# full LTO, on a hosted x86-64 runner. If List's Ir falls by less than 5%
# (head/base above 0.95), the attribution was wrong and the 14900K timing is
# not run. It reads instruction counts, never times.
name: index-miss-profile

on:
  push:
    branches: [claude/halo-index-miss]
    paths:
      - .github/workflows/index-miss-profile.yml

defaults:
  run:
    shell: bash

env:
  BASE: 8ee6634
  LIST_INNER: 200
  TOWERS_INNER: 60

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Install the host toolchain and valgrind
        run: |
          set -uo pipefail
          make toolchain
          sudo apt-get update -q
          sudo apt-get install -y -q valgrind binutils

      - name: Build Halo's bench host from the base and from the head
        run: |
          set -euo pipefail
          out="$PWD/build/index-miss-profile"
          rm -rf "$out"; mkdir -p "$out/callgrind"
          release=$(sed -n 's/^release = //p' whitefoot.pin)
          make compiler
          make toolchain-check
          wfc="$PWD/build/whitefoot/$release/whitefootc"
          # Same compiler on both sides; only the source differs.
          git worktree add --detach "$PWD/build/base-src" "$BASE"
          SECONDS=0
          (cd build/base-src && "$wfc" --graph research/experiments/halo-bench/modules.wfg --entry bench --full-lto -o "$out/halo-base")
          echo "base full-LTO build: ${SECONDS} s"
          SECONDS=0
          "$wfc" --graph research/experiments/halo-bench/modules.wfg --entry bench --full-lto -o "$out/halo-head"
          echo "head full-LTO build: ${SECONDS} s"
          {
            echo "base $(git rev-parse "$BASE"), head $(git rev-parse HEAD), compiler $release, LIST_INNER $LIST_INNER, TOWERS_INNER $TOWERS_INNER"
            sha256sum "$wfc" "$out/halo-base" "$out/halo-head"
            file "$out/halo-base" "$out/halo-head"
            /usr/bin/clang --version | head -n 1
            uname -a
            valgrind --version || true
          } | tee "$out/manifest.txt"

      - name: Generate the List and Towers bundles with a reduced iteration count
        run: |
          set -euo pipefail
          out="$PWD/build/index-miss-profile"
          # awfy.py writes the bench's bundles (List 1000, Towers 300 inner
          # iterations); only the driver's iteration argument is replaced, the
          # same bytes then go to both sides.
          python3 -B research/experiments/halo-bench/awfy.py --checkout build/awfy-src --out build/awfy-bundles
          for pair in "List:$LIST_INNER:1000" "Towers:$TOWERS_INNER:300"; do
            IFS=: read -r name n full <<< "$pair"
            sed "s/^assert(require(\"${name,,}\"):inner_benchmark_loop($full),\$/assert(require(\"${name,,}\"):inner_benchmark_loop($n),/" \
              "build/awfy-bundles/$name.lua" > "$out/$name.lua"
            grep -q "inner_benchmark_loop($n)," "$out/$name.lua"
            ! cmp -s "build/awfy-bundles/$name.lua" "$out/$name.lua"
          done
          sha256sum "$out/List.lua" "$out/Towers.lua" | tee -a "$out/manifest.txt"

      - name: Check both sides verify each program
        run: |
          set -euo pipefail
          out="$PWD/build/index-miss-profile"
          # The bundle's driver asserts the benchmark's own result check on
          # every inner iteration and prints 1 only when all verified; expect
          # exactly 1 from both sides.
          for prog in List Towers; do
            for side in base head; do
              "$out/halo-$side" < "$out/$prog.lua" > "$out/check-$side-$prog.out" 2> "$out/check-$side-$prog.err"
              echo "$prog $side: '$(cat "$out/check-$side-$prog.out")'; stderr: $(tr '\n' ' ' < "$out/check-$side-$prog.err")"
              test "$(cat "$out/check-$side-$prog.out")" = 1
            done
          done

      - name: Profile with callgrind
        run: |
          set -uo pipefail
          out="$PWD/build/index-miss-profile"
          cg="$out/callgrind"
          : > "$cg/ir.txt"
          for prog in List Towers; do
            for side in base head; do
              run="$side-$prog"
              SECONDS=0
              valgrind --tool=callgrind --dump-instr=yes --collect-jumps=no --compress-strings=no --compress-pos=no \
                --callgrind-out-file="$cg/$run.out" "$out/halo-$side" < "$out/$prog.lua" > "$cg/$run.stdout" 2> "$cg/$run.stderr"
              echo "== callgrind $run: exit $?, ${SECONDS} s, printed $(cat "$cg/$run.stdout")"
              tail -n 4 "$cg/$run.stderr"
              ir=$(sed -n 's/^==[0-9]*== Collected : *\([0-9]*\).*/\1/p' "$cg/$run.stderr")
              echo "$run $ir" >> "$cg/ir.txt"
              # Per-function exclusive Ir; header lines plus the top 60 rows.
              callgrind_annotate --inclusive=no "$cg/$run.out" 2>&1 | head -n 100 > "$cg/$run-exclusive.txt" || true
            done
          done

      - name: Summary
        run: |
          set -uo pipefail
          cg="$PWD/build/index-miss-profile/callgrind"
          {
            echo "whole-program Ir (callgrind 'Collected'); LIST_INNER $LIST_INNER, TOWERS_INNER $TOWERS_INNER"
            echo "falsifier: List head/base above 0.95 (fall under 5%) means timing is not run"
            for prog in List Towers; do
              b=$(awk -v k="base-$prog" '$1 == k { print $2 }' "$cg/ir.txt")
              h=$(awk -v k="head-$prog" '$1 == k { print $2 }' "$cg/ir.txt")
              python3 -c "b,h=int('${b:-0}'),int('${h:-0}')
          print('$prog: base %d, head %d, head/base %s' % (b, h, '%.4f (change %+.2f%%)' % (h/b, (h/b-1)*100) if b else 'n/a'))"
            done
            for run in base-List head-List base-Towers head-Towers; do
              echo; echo "== $run exclusive top 15"
              grep -A22 -m1 'Ir ' "$cg/$run-exclusive.txt" | head -n 22
            done
          } | tee "$cg/summary.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: index-miss-profile
          path: |
            build/index-miss-profile/
            !build/index-miss-profile/halo-base
            !build/index-miss-profile/halo-head
          if-no-files-found: ignore
          retention-days: 30

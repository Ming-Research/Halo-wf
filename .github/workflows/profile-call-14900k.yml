# Temporary, for the Halo performance line: profiles fib's call path on the
# 14900K after the loop { match } dispatch (research/experiments/halo-bench/
# RESULTS.md, "The call path on the 14900K"). A push of this file runs it,
# made only once the runner is confirmed idle. Removed before the pull
# request is marked ready.
name: profile-call-14900k

on:
  push:
    branches: [claude/halo-call]
    paths: [.github/workflows/profile-call-14900k.yml]

defaults:
  run:
    shell: bash

jobs:
  profile:
    runs-on: [self-hosted, 14900k]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Profile fib's call path
        run: |
          set -euo pipefail
          out="$PWD/build/bench-out"
          rm -rf "$out"; mkdir -p "$out"
          release=$(sed -n 's/^release = //p' whitefoot.pin)
          make compiler
          make toolchain-check
          wfc="$PWD/build/whitefoot/$release/whitefootc"
          sh research/experiments/halo-oracle/fetch-redis.sh "$PWD/build/redis"
          lua="$PWD/build/redis/redis-7.0.15/deps/lua/src/lua"
          start=$(date +%s)
          "$wfc" --graph research/experiments/halo-bench/modules.wfg --entry bench --full-lto -o "$out/halo"
          echo "full-LTO build: $(( $(date +%s) - start )) s"
          sed 's/^local N = 30$/local N = 34/' research/experiments/halo-bench/kernels/fib.lua > "$out/fib.lua"
          grep -q '^local N = 34$' "$out/fib.lua"
          src="$out/fib.lua"
          {
            echo "branch $(git rev-parse HEAD), release $release"
            sha256sum "$wfc" "$out/halo" "$lua" "$src"
            /usr/bin/clang --version | head -n 1
            uname -a
            lscpu | grep -E 'Model name|^CPU\(s\)|MHz|Hypervisor' || true
            perf --version 2>&1 || true
            echo "perf_event_paranoid: $(cat /proc/sys/kernel/perf_event_paranoid 2>/dev/null || echo unknown)"
          } | tee "$out/manifest.txt"
          event=cycles
          if ! perf record -q -e cycles -o "$out/probe.data" true 2> "$out/probe.err"; then
            event=cpu-clock
          fi
          echo "event: $event" | tee -a "$out/manifest.txt"
          for i in 1 2 3; do
            for side in halo puc; do
              if [ "$side" = halo ]; then cmd=("$out/halo"); else cmd=("$lua" -); fi
              start=$(date +%s.%N)
              perf record -q -e "$event" -o "$out/$side-$i.data" "${cmd[@]}" < "$src" > "$out/$side-$i.out" 2> "$out/$side-$i.err"
              end=$(date +%s.%N)
              perf report -q -i "$out/$side-$i.data" --no-children --sort symbol --percent-limit 0.3 --stdio 2> /dev/null > "$out/report-$side-$i.txt"
              echo "== $side launch $i: $(cat "$out/$side-$i.out"), $(awk -v a="$start" -v b="$end" 'BEGIN { printf "%.3f", b - a }') s"
              head -n 25 "$out/report-$side-$i.txt"
            done
          done
          perf annotate -i "$out/halo-1.data" --stdio 2> /dev/null > "$out/annotate-halo.txt" || true
          perf annotate -i "$out/puc-1.data" --stdio 2> /dev/null > "$out/annotate-puc.txt" || true
          nm -C "$out/halo" > "$out/halo-symbols.txt"
          grep -E ' [tT] .*(enter_lua|push_frame|prepare|finish|pop_frame|close_upvalues|ensure_stack|native_binding|run)' "$out/halo-symbols.txt" | tee "$out/call-symbols.txt"
          awk '{print $3}' "$out/call-symbols.txt" | while read -r sym; do
            objdump -d --no-show-raw-insn -M intel --disassemble="$sym" "$out/halo" > "$out/disasm-$sym.txt" 2> /dev/null || true
            echo "$sym $(grep -c -E '^ +[0-9a-f]+:' "$out/disasm-$sym.txt") instructions"
          done | tee "$out/call-sizes.txt"
          for sym in luaD_precall luaD_poscall; do
            objdump -d --no-show-raw-insn -M intel --disassemble="$sym" "$lua" > "$out/disasm-puc-$sym.txt" 2> /dev/null || true
            echo "$sym $(grep -c -E '^ +[0-9a-f]+:' "$out/disasm-puc-$sym.txt") instructions"
          done | tee -a "$out/call-sizes.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: halo-call-profile-14900k
          path: build/bench-out/
          retention-days: 30
